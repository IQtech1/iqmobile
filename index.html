<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İQCODE - محرر لغات البرمجة الذكي</title>

<style>
:root[data-theme="dark"] {
  --bg: #0d1117; --bg-2: #161b22; --bg-3: #21262d;
  --border: #30363d; --text: #e6edf3; --text-dim: #8b949e;
  --primary: #58a6ff; --primary-2: #1f6feb;
  --success: #2ea043; --danger: #f85149; --warning: #d29922;
  --accent: #a855f7;
  --gradient: linear-gradient(90deg, #58a6ff, #a855f7, #ec4899);
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2;
  --border: #d0d7de; --text: #1f2328; --text-dim: #656d76;
  --primary: #0969da; --primary-2: #0550ae;
  --success: #1a7f37; --danger: #cf222e; --warning: #9a6700;
  --accent: #8250df;
  --gradient: linear-gradient(90deg, #0969da, #8250df, #bf3989);
}

* { margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, sans-serif;
  transition: background-color 0.2s, color 0.2s, border-color 0.2s; }

body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }

.sidebar {
  width: 260px; background: var(--bg-2);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: transform 0.3s; z-index: 100;
}
.sidebar-header { padding: 18px 16px; border-bottom: 1px solid var(--border); }
.logo { font-size: 26px; font-weight: 900;
  background: var(--gradient); -webkit-background-clip: text;
  -webkit-text-fill-color: transparent; letter-spacing: 1.5px; }
.tagline { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
.sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 14px; border-radius: 8px; cursor: pointer;
  color: var(--text); font-size: 14px; font-weight: 500;
  margin-bottom: 4px; user-select: none;
}
.nav-item:hover { background: var(--bg-3); }
.nav-item.active { background: var(--primary-2); color: white; }
.nav-item .icon { font-size: 18px; width: 22px; text-align: center; }
.sidebar-footer { padding: 12px; border-top: 1px solid var(--border); }
.theme-toggle {
  width: 100%; padding: 10px; background: var(--bg-3);
  border: 1px solid var(--border); color: var(--text);
  border-radius: 8px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 8px;
}
.theme-toggle:hover { border-color: var(--primary); }

.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center;
  gap: 8px; flex-wrap: wrap;
}
.menu-btn {
  display: none; background: var(--bg-3); border: 1px solid var(--border);
  color: var(--text); padding: 8px 12px; border-radius: 6px;
  cursor: pointer; font-size: 16px;
}
select, button, input {
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); padding: 8px 12px;
  border-radius: 6px; font-size: 13px; cursor: pointer;
  outline: none; font-family: inherit;
}
input { cursor: text; min-width: 130px; }
select:hover, button:hover { border-color: var(--primary); }
button.primary { background: var(--success); border: none; color: white; font-weight: bold; }
button.primary:hover { background: #3fb950; }
button.danger { background: var(--danger); border: none; color: white; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.page { flex: 1; display: none; overflow: hidden; flex-direction: column; }
.page.active { display: flex; }

.editor-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.editor-area {
  flex: 1; position: relative; overflow: hidden; min-height: 150px;
  display: flex; background: var(--bg);
}
.line-numbers {
  background: var(--bg-2); color: var(--text-dim);
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px; line-height: 1.6;
  padding: 12px 8px; text-align: right; user-select: none;
  overflow: hidden; min-width: 45px; border-left: 1px solid var(--border);
  direction: ltr;
}
.line-numbers .err-num { color: var(--danger); font-weight: bold; background: rgba(248,81,73,0.15); }
#codeEditor {
  flex: 1; width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  border: none; padding: 12px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px; line-height: 1.6;
  resize: none; outline: none; direction: ltr;
  text-align: left; tab-size: 2; white-space: pre;
  overflow: auto;
}
.divider {
  height: 6px; background: var(--border); cursor: row-resize;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}
.divider::before {
  content: ''; width: 40px; height: 3px;
  background: var(--primary); border-radius: 2px;
}
.output-section {
  background: var(--bg-2); display: flex; flex-direction: column;
  height: 40%; overflow: hidden; flex-shrink: 0;
}
.tabs {
  display: flex; background: var(--bg);
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.tab {
  padding: 10px 16px; cursor: pointer;
  border-bottom: 2px solid transparent; font-size: 13px;
  white-space: nowrap; user-select: none;
}
.tab:hover { background: var(--bg-2); }
.tab.active {
  color: var(--primary); border-bottom-color: var(--primary);
  background: var(--bg-2);
}
.tab-content {
  flex: 1; padding: 12px; overflow-y: auto;
  font-family: 'Consolas', monospace; font-size: 13px;
  line-height: 1.6; direction: ltr; text-align: left;
  white-space: pre-wrap; word-break: break-word;
}
.tab-content.hidden { display: none; }
#stdin {
  width: 100%; height: 100%; background: var(--bg);
  color: var(--text); border: none; padding: 12px;
  font-family: monospace; font-size: 13px;
  resize: none; outline: none;
}
#previewFrame {
  width: 100%; height: 100%; border: none; background: white;
}

.error-item {
  background: rgba(248, 81, 73, 0.1);
  border-right: 3px solid var(--danger);
  padding: 10px 12px; margin-bottom: 8px;
  border-radius: 6px; direction: rtl; text-align: right;
}
.error-item .line { color: var(--danger); font-weight: bold; font-size: 12px; }
.error-item .message {
  color: var(--text); margin-top: 4px;
  font-family: monospace; font-size: 12px;
  direction: ltr; text-align: left;
}
.error-item .suggestion {
  color: var(--success); margin-top: 6px;
  padding: 6px 8px; background: var(--bg);
  border-radius: 4px; font-size: 12px;
}
.empty-state { text-align: center; color: var(--text-dim); padding: 30px; direction: rtl; }
.loading {
  display: inline-block; width: 14px; height: 14px;
  border: 2px solid var(--border); border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite;
  vertical-align: middle;
}
@keyframes spin { to { transform: rotate(360deg); } }

.tips-container { flex: 1; overflow-y: auto; padding: 20px; }
.tips-lang-picker {
  background: var(--bg-2); padding: 16px; border-radius: 12px;
  margin-bottom: 20px; display: flex; gap: 10px;
  align-items: center; flex-wrap: wrap;
}
.tips-lang-picker select { flex: 1; min-width: 200px; padding: 10px; }
.tips-content h2 { color: var(--primary); margin-bottom: 12px; font-size: 22px; }
.tips-section {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 18px; margin-bottom: 16px;
}
.tips-section h3 { color: var(--accent); margin-bottom: 12px; font-size: 17px; }
.func-item {
  background: var(--bg-3); padding: 12px; border-radius: 8px;
  margin-bottom: 10px; border-right: 3px solid var(--primary);
}
.func-item .fname {
  color: var(--warning); font-family: monospace;
  font-weight: bold; font-size: 14px;
  direction: ltr; text-align: left; display: block; margin-bottom: 6px;
}
.func-item .fdesc { color: var(--text); font-size: 13px; margin-bottom: 8px; }
.func-item .fexample {
  background: var(--bg); padding: 10px; border-radius: 6px;
  font-family: monospace; font-size: 12px; color: var(--success);
  direction: ltr; text-align: left; overflow-x: auto;
  white-space: pre; margin-bottom: 6px;
}
.insert-btn {
  background: var(--primary-2); border: none; color: white;
  padding: 5px 12px; border-radius: 5px;
  font-size: 11px; margin-top: 6px; cursor: pointer;
}
.insert-btn:hover { background: var(--primary); }

.projects-container { flex: 1; overflow-y: auto; padding: 20px; }
.projects-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.projects-header h2 { color: var(--primary); }
.projects-header .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.projects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}
.project-card {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 12px; padding: 16px;
}
.project-card:hover { border-color: var(--primary); }
.project-card h3 { color: var(--text); margin-bottom: 8px; font-size: 16px; word-break: break-word; }
.project-card .meta { color: var(--text-dim); font-size: 12px; margin-bottom: 12px; }
.project-card .lang-badge {
  background: var(--accent); color: white;
  padding: 3px 10px; border-radius: 12px;
  font-size: 11px; display: inline-block; margin-bottom: 10px;
}
.project-card .actions { display: flex; gap: 8px; flex-wrap: wrap; }
.project-card .actions button { flex: 1; font-size: 12px; padding: 6px 10px; min-width: 70px; }

.toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--success); color: white;
  padding: 12px 24px; border-radius: 8px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  opacity: 0; transition: 0.3s; z-index: 9999; font-size: 14px;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary-2); }

/* شريط حالة الاتصال */
.status-bar {
  background: var(--bg-3); border-top: 1px solid var(--border);
  padding: 4px 12px; font-size: 11px; color: var(--text-dim);
  display: flex; justify-content: space-between; align-items: center;
}
.status-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--success);
  margin-left: 6px;
}
.status-dot.busy { background: var(--warning); animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: 0.4; } }

@media (max-width: 768px) {
  .sidebar {
    position: fixed; top: 0; right: 0; height: 100vh;
    transform: translateX(100%);
    box-shadow: -4px 0 20px rgba(0,0,0,0.3);
    width: 240px;
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: block; }
  .topbar { padding: 8px; gap: 6px; }
  select, button, input { font-size: 12px; padding: 7px 10px; }
  input { min-width: 80px; flex: 1; }
  .tab { padding: 8px 10px; font-size: 12px; }
  .projects-grid { grid-template-columns: 1fr; }
  .tips-container, .projects-container { padding: 12px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 99; display: none;
  }
  .overlay.show { display: block; }
}
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">İQCODE</div>
      <div class="tagline">محرر البرمجة الذكي</div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="editor">
        <span class="icon">💻</span> المحرر
      </div>
      <div class="nav-item" data-page="tips">
        <span class="icon">💡</span> النصائح والدوال
      </div>
      <div class="nav-item" data-page="projects">
        <span class="icon">📁</span> مشاريعي المحفوظة
      </div>
    </nav>
    <div class="sidebar-footer">
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeText">الوضع الليلي</span>
      </button>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <main class="content">
    <div class="topbar">
      <button class="menu-btn" onclick="openSidebar()">☰</button>
      <select id="langSelect"></select>
      <input type="text" id="projectName" placeholder="اسم المشروع..." value="my_project">
      <button class="primary" id="runBtn" onclick="runCode()">▶ تشغيل</button>
      <button onclick="saveProject()">💾 حفظ</button>
      <button onclick="downloadCode()">⬇ تنزيل</button>
    </div>

    <div class="page active" id="page-editor">
      <div class="editor-wrapper">
        <div class="editor-area">
          <div class="line-numbers" id="lineNumbers">1</div>
          <textarea id="codeEditor" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"></textarea>
        </div>
        <div class="divider" id="divider"></div>
        <div class="output-section" id="outputSection">
          <div class="tabs">
            <div class="tab active" data-tab="output">📤 المخرجات</div>
            <div class="tab" data-tab="errors">🐛 الأخطاء <span id="errorCount"></span></div>
            <div class="tab" data-tab="input">⌨️ الإدخال</div>
          </div>
          <div id="tab-output" class="tab-content">
            <div class="empty-state">اضغط "تشغيل" لتنفيذ الكود...</div>
          </div>
          <div id="tab-errors" class="tab-content hidden">
            <div class="empty-state">لا توجد أخطاء حتى الآن ✨</div>
          </div>
          <div id="tab-input" class="tab-content hidden" style="padding:0;">
            <textarea id="stdin" placeholder="اكتب الإدخال هنا (stdin)..."></textarea>
          </div>
        </div>
        <div class="status-bar">
          <span><span class="status-dot" id="statusDot"></span><span id="statusText">جاهز</span></span>
          <span id="serverText">الخادم: —</span>
        </div>
      </div>
    </div>

    <div class="page" id="page-tips">
      <div class="tips-container">
        <div class="tips-lang-picker">
          <label>اختر اللغة:</label>
          <select id="tipsLangSelect" onchange="loadTips()"></select>
        </div>
        <div class="tips-content" id="tipsContent"></div>
      </div>
    </div>

    <div class="page" id="page-projects">
      <div class="projects-container">
        <div class="projects-header">
          <h2>📁 مشاريعي المحفوظة</h2>
          <div class="actions">
            <button onclick="exportProjects()" style="background:var(--primary-2);color:white;border:none;">📤 تصدير</button>
            <button onclick="document.getElementById('importFile').click()" style="background:var(--accent);color:white;border:none;">📥 استيراد</button>
            <button class="danger" onclick="clearAllProjects()">🗑 مسح الكل</button>
          </div>
          <input type="file" id="importFile" accept=".json" style="display:none;" onchange="importProjects(event)">
        </div>
        <div class="projects-grid" id="projectsGrid"></div>
      </div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============================================================
   İQCODE v5.0 - دعم HTML/CSS/JS + 3 APIs احتياطية
   ============================================================ */

/* ============ اللغات ============ */
const LANGUAGES = {
  // لغات الويب - تشغيل محلي بدون API
  html:   { name: "HTML", ext: "html", local: true, fileExt: "html" },
  css:    { name: "CSS", ext: "css", local: true, fileExt: "css" },
  
  // لغات Piston

/* ============ كود البداية ============ */

/* ============================================================
   أدوات
   ============================================================ */
function setStatus(text, busy) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  if (busy) dot.classList.add('busy');
  else dot.classList.remove('busy');
}

function setServer(text) {
  document.getElementById('serverText').textContent = 'الخادم: ' + text;
}

/* ============================================================
   أرقام الأسطر
   ============================================================ */
function updateLineNumbers() {
  const lines = codeEditor.value.split('\n');
  let html = '';
  for (let i = 1; i <= lines.length; i++) {
    const isErr = errorLines.includes(i);
    html += `<div class="${isErr ? 'err-num' : ''}">${i}</div>`;
  }
  lineNumbers.innerHTML = html;
  lineNumbers.scrollTop = codeEditor.scrollTop;
}

codeEditor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = codeEditor.scrollTop;
});

codeEditor.addEventListener('input', () => {
  updateLineNumbers();
});

/* Tab key */
codeEditor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = codeEditor.selectionStart;
    const end = codeEditor.selectionEnd;
    codeEditor.value = codeEditor.value.substring(0, start) + '    ' + codeEditor.value.substring(end);
    codeEditor.selectionStart = codeEditor.selectionEnd = start + 4;
    updateLineNumbers();
  }
});

/* ============================================================
   اللغات
   ============================================================ */
function populateLangLists() {
  const langSelect = document.getElementById('langSelect');
  const tipsLangSelect = document.getElementById('tipsLangSelect');
  
  const sorted = Object.keys(LANGUAGES).sort((a, b) => 
    LANGUAGES[a].name.localeCompare(LANGUAGES[b].name)
  );
  
  sorted.forEach(key => {
    const o1 = document.createElement('option');
    o1.value = key;
    o1.textContent = LANGUAGES[key].name;
    langSelect.appendChild(o1);
    
    const o2 = document.createElement('option');
    o2.value = key;
    o2.textContent = LANGUAGES[key].name;
    tipsLangSelect.appendChild(o2);
  });
  
  langSelect.value = 'html';
  tipsLangSelect.value = 'html';
  
  langSelect.addEventListener('change', (e) => {
    currentLang = e.target.value;
    codeEditor.value = STARTER_CODE[currentLang] || STARTER_CODE.default;
    updateLineNumbers();
    clearErrorLines();
    showToast(`تم التبديل إلى ${LANGUAGES[currentLang].name}`, 'info');
  });
}

      const page = item.dataset.page;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      if (page === 'projects') loadProjects();
      if (page === 'tips') loadTips();
      closeSidebar();
    });
  });
  
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      tab.classList.add('active');
      document.getElementById('tab-' + target).classList.remove('hidden');
    });
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === name);
  });
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  const target = document.getElementById('tab-' + name);
  if (target) target.classList.remove('hidden');
}

/* ============================================================
   الثيم
   ============================================================ */
function toggleTheme() {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
  document.getElementById('themeIcon').textContent = isDark ? '🌙' : '☀️';
  document.getElementById('themeText').textContent = isDark ? 'الوضع الليلي' : 'الوضع النهاري';
  localStorage.setItem('iqcode-theme', isDark ? 'dark' : 'light');
}

function restoreTheme() {
  const saved = localStorage.getItem('iqcode-theme');
  if (saved === 'light') {
    isDark = false;
    document.documentElement.setAttribute('data-theme', 'light');
    document.getElementById('themeIcon').textContent = '☀️';
    document.getElementById('themeText').textContent = 'الوضع النهاري';
  }
}

/* ============================================================
   تشغيل الكود
   ============================================================ */
async function runCode() {
  const lang = LANGUAGES[currentLang];
  if (!lang) return;
  
  const code = codeEditor.value;
  const runBtn = document.getElementById('runBtn');
  const stdin = document.getElementById('stdin').value;
  
  if (!code.trim()) {
    showOutput('⚠️ لا يوجد كود');
    return;
  }
  
  // ===== تشغيل محلي للغات الويب =====
  if (lang.local) {
    runLocalWeb(code, lang);
    return;
  }
  
  // ===== لغات لا تُشغَّل =====
  if (lang.noRun) {
    showOutput(`⚠️ اللغة "${lang.name}" للتحرير فقط.`);
    return;
  }
  
  // ===== تشغيل عبر API =====
  runBtn.disabled = true;
  runBtn.innerHTML = '<span class="loading"></span> جارٍ...';
  showOutput('⏳ جارٍ تنفيذ الكود...');
  switchTab('output');
  setStatus('يتصل بالخادم...', true);
  
  let lastError = null;
  
  // جرّب كل خادم بالترتيب
  for (const server of SERVERS) {
    try {
      setServer(server.name);
      const response = await fetch(server.url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          language: lang.ext,
          version: lang.version,
          files: [{ content: code, name: getFileName(lang) }],
          stdin: stdin,
          compile_timeout: 10000,
          run_timeout: 5000
        })
      });
      
      if (!response.ok) {
        throw new Error('HTTP ' + response.status);
      }
      
      const result = await response.json();
      const run = result.run || {};
      const compile = result.compile || {};
      
      let output = '';
      if (compile.stdout) output += compile.stdout;
      if (compile.stderr) output += compile.stderr;
      if (run.stdout) output += run.stdout;
      if (run.stderr) output += run.stderr;
      
      if (!output) output = '✅ تم التنفيذ بنجاح (بدون مخرجات)';
      
      showOutput(output);
      analyzeErrors(compile.stderr || '', run.stderr || '');
      setStatus('تم بنجاح ✅', false);
      
      runBtn.disabled = false;
      runBtn.innerHTML = '▶ تشغيل';
      return;
      
    } catch (err) {
      lastError = err;
      console.warn(`Server ${server.name} failed:`, err.message);
      // جرّب الخادم التالي
    }
  }
  
  // فشل كل الخوادم
  setStatus('فشل الاتصال ❌', false);
  setServer('لا يوجد');
  showOutput(
    '❌ تعذّر الوصول لجميع الخوادم.\n\n' +
    'الأخطاء:\n' + (lastError ? lastError.message : 'غير معروف') + '\n\n' +
    '💡 الحلول:\n' +
    '1. تأكد أن الموقع مرفوع على GitHub Pages وليس عارض HTML\n' +
    '2. جرب لغة HTML أو CSS (تعمل بدون إنترنت)\n' +
    '3. قد يحتاج الإنترنت للوصول لخوادم خارجية'
  );
  
  runBtn.disabled = false;
  runBtn.innerHTML = '▶ تشغيل';
}

/* اسم الملف المناسب */
function getFileName(lang) {
  const names = {
    java: 'Main.java',
    csharp: 'Program.cs',
    go: 'main.go',
    rust: 'main.rs',
    kotlin: 'Main.kt',
    swift: 'main.swift',
    dart: 'main.dart',
    scala: 'Main.scala',
    c: 'main.c',
    cpp: 'main.cpp'
  };
  return names[lang.ext] || ('main.' + lang.fileExt);
}

/* ============================================================
   تشغيل HTML/CSS/JS محلياً
   ============================================================ */
function runLocalWeb(code, lang) {
  try {
    // إنشاء iframe
    let previewFrame = document.getElementById('previewFrame');
    
    // إذا لم يكن موجوداً، أنشئه في تبويب المخرجات
    if (!previewFrame) {
      const output = document.getElementById('tab-output');
      output.innerHTML = '';
      previewFrame = document.createElement('iframe');
      previewFrame.id = 'previewFrame';
      previewFrame.sandbox = 'allow-scripts allow-modals allow-forms allow-popups';
      output.appendChild(previewFrame);
    }
    
    // كتابة الكود داخل iframe
    let html = code;
    
    // إذا كانت CSS، نغلّفها في HTML
    if (lang.ext === 'css' && !code.toLowerCase().includes('<html')) {
      html = `<!DOCTYPE html>
<html>
<head><style>${code}</style></head>
<body>
  <h1>تجربة CSS</h1>
  <p>هذا نص تجريبي لتطبيق الستايل عليه</p>
  <div class="box">صندوق</div>
  <button>زر</button>
</body>
</html>`;
    }
    
    previewFrame.srcdoc = html;
    switchTab('output');
    setStatus('تم التشغيل (محلي)', false);
    showToast('✅ تم التشغيل في المعاينة');
    
  } catch (err) {
    showOutput('❌ خطأ: ' + err.message);
  }
}

/* ============================================================
   المخرجات
   ============================================================ */
function showOutput(text) {
  const output = document.getElementById('tab-output');
  output.innerHTML = '';
  const pre = document.createElement('div');
  pre.textContent = text;
  pre.style.whiteSpace = 'pre-wrap';
  output.appendChild(pre);
  switchTab('output');
}

/* ============================================================
   كاشف الأخطاء
   ============================================================ */
function analyzeErrors(compileErr, runErr) {
  const errorsDiv = document.getElementById('tab-errors');
  const errCount = document.getElementById('errorCount');
  const allErrors = (compileErr + '\n' + runErr).trim();
  
  clearErrorLines();
  
  if (!allErrors) {
    errorsDiv.innerHTML = '<div class="empty-state" style="color:var(--success)">✅ لا توجد أخطاء!</div>';
    errCount.textContent = '';
    return;
  }
  
  const lines = allErrors.split('\n').filter(l => l.trim());
  const parsed = lines.map(line => ({
    line: extractLineNumber(line),
    message: line.trim(),
    suggestion: suggestFix(line)
  }));
  
  errorsDiv.innerHTML = '';
  parsed.forEach(err => {
    const div = document.createElement('div');
    div.className = 'error-item';
    div.innerHTML = `
      ${err.line ? `<div class="line">📍 السطر ${err.line}</div>` : ''}
      <div class="message">${escapeHtml(err.message)}</div>
      ${err.suggestion ? `<div class="suggestion">💡 ${escapeHtml(err.suggestion)}</div>` : ''}
    `;
    errorsDiv.appendChild(div);
  });
  
  errCount.textContent = `(${parsed.length})`;
  errorLines = parsed.filter(e => e.line).map(e => parseInt(e.line));
  updateLineNumbers();
  switchTab('errors');
}

function clearErrorLines() {
  errorLines = [];
  updateLineNumbers();
}

function extractLineNumber(line) {
  let m = line.match(/line (\d+)/i);
  if (m) return m[1];
  m = line.match(/:(\d+):(\d+):/);
  if (m) return m[1];
  m = line.match(/:(\d+):/);
  if (m) return m[1];
  m = line.match(/\((\d+)\)/);
  if (m) return m[1];
  return null;
}

function suggestFix(message) {
  const msg = message.toLowerCase();
  if (msg.includes('indentationerror')) return 'تحقق من المسافات البادئة';
  if (msg.includes('nameerror')) {
    const m = message.match(/name '(\w+)'/);
    return m ? `"${m[1]}" غير معرّف` : 'اسم غير معرّف';
  }
  if (msg.includes('typeerror')) return 'خطأ في نوع البيانات';
  if (msg.includes('syntaxerror')) return 'خطأ في الصياغة';
  if (msg.includes('zerodivision')) return 'القسمة على صفر';
  if (msg.includes('indexerror')) return 'الفهرس خارج النطاق';
  if (msg.includes('is not defined')) {
    const m = message.match(/(\w+) is not defined/);
    return m ? `"${m[1]}" غير معرّف` : 'غير معرّف';
  }
  if (msg.includes('expected')) return 'رمز متوقع ناقص';
  if (msg.includes('cannot find symbol')) return 'الرمز غير موجود';
  if (msg.includes('segmentation fault')) return 'خطأ في الذاكرة';
  return null;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

/* ============================================================
   النصائح
   ============================================================ */
function loadTips() {
  const langKey = document.getElementById('tipsLangSelect').value;
  const tips = TIPS[langKey] || GENERIC_TIPS;
  const langName = LANGUAGES[langKey] ? LANGUAGES[langKey].name : langKey;
  const container = document.getElementById('tipsContent');
  let html = `<h2>💡 نصائح ${langName}</h2>`;
  
  if (!TIPS[langKey]) {
    html += `<div class="tips-section"><p style="color:var(--text-dim)">لا توجد نصائح مفصلة لهذه اللغة. جرب: HTML، CSS، Python، JavaScript، C++، Java</p></div>`;
  }
  
  tips.sections.forEach(section => {
    html += `<div class="tips-section"><h3>${section.title}</h3>`;
    section.functions.forEach((fn, idx) => {
      const safeId = `snip_${langKey}_${idx}`;
      window[safeId] = fn.example;
      html += `
        <div class="func-item">
          <span class="fname">${escapeHtml(fn.name)}</span>
          <div class="fdesc">${escapeHtml(fn.desc)}</div>
          <div class="fexample">${escapeHtml(fn.example)}</div>
          <button class="insert-btn" onclick="insertSnippetById('${safeId}')">➕ إدراج</button>
        </div>`;
    });
    html += `</div>`;
  });
  
  container.innerHTML = html;
}

function insertSnippetById(id) {
  const code = window[id];
  if (!code) return;
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector('[data-page="editor"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-editor').classList.add('active');
  codeEditor.value = codeEditor.value + '\n' + code + '\n';
  updateLineNumbers();
  showToast('✅ تم الإدراج');
  closeSidebar();
}

/* ============================================================
   المشاريع
   ============================================================ */
function saveProject() {
  const name = document.getElementById('projectName').value.trim() || 'مشروع';
  const code = codeEditor.value;
  if (!code.trim()) { showToast('⚠️ لا يوجد كود', 'error'); return; }
  
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  const idx = projects.findIndex(p => p.name === name);
  const project = {
    name, code, lang: currentLang,
    date: new Date().toISOString(),
    id: idx >= 0 ? projects[idx].id : Date.now()
  };
  
  if (idx >= 0) { projects[idx] = project; showToast('💾 تم التحديث'); }
  else { projects.push(project); showToast('💾 تم الحفظ'); }
  
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
}

function loadProjects() {
  const grid = document.getElementById('projectsGrid');
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  if (projects.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;">📭 لا توجد مشاريع محفوظة</div>';
    return;
  }
  grid.innerHTML = '';
  projects.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    card.innerHTML = `
      <span class="lang-badge">${LANGUAGES[p.lang]?.name || p.lang}</span>
      <h3>${escapeHtml(p.name)}</h3>
      <div class="meta">📅 ${new Date(p.date).toLocaleString('ar-EG')}</div>
      <div class="actions">
        <button onclick="openProject(${p.id})" style="background:var(--primary-2);color:white;border:none;">📂 فتح</button>
        <button class="danger" onclick="deleteProject(${p.id})">🗑 حذف</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openProject(id) {
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  const p = projects.find(x => x.id === id);
  if (!p) return;
  currentLang = p.lang;
  document.getElementById('langSelect').value = p.lang;
  document.getElementById('projectName').value = p.name;
  codeEditor.value = p.code;
  updateLineNumbers();
  clearErrorLines();
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector('[data-page="editor"]').classList.add('active');
  document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
  document.getElementById('page-editor').classList.add('active');
  showToast('📂 تم الفتح');
}

function deleteProject(id) {
  if (!confirm('حذف؟')) return;
  let projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  projects = projects.filter(p => p.id !== id);
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
  loadProjects();
  showToast('🗑 تم الحذف');
}

function clearAllProjects() {
  if (!confirm('حذف جميع المشاريع؟')) return;
  localStorage.removeItem('iqcode-projects');
  loadProjects();
  showToast('🗑 تم المسح');
}

/* ============================================================
   تصدير/استيراد
   ============================================================ */
function exportProjects() {
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  if (projects.length === 0) { showToast('⚠️ لا توجد مشاريع', 'error'); return; }
  
  const blob = new Blob([JSON.stringify({
    app: 'İQCODE', version: '5.0',
    exportedAt: new Date().toISOString(),
    projects
  }, null, 2)], { type: 'application/json;charset=utf-8' });
  
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iqcode_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`📤 تم تصدير ${projects.length} مشروع`);
}

function importProjects(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      let imported = Array.isArray(data) ? data : (data.projects || []);
      const existing = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
      let added = 0, updated = 0;
      imported.forEach(p => {
        if (!p.name || !p.code || !p.lang) return;
        const idx = existing.findIndex(x => x.name === p.name);
        const project = {
          name: p.name, code: p.code, lang: p.lang,
          date: p.date || new Date().toISOString(),
          id: idx >= 0 ? existing[idx].id : Date.now() + Math.random()
        };
        if (idx >= 0) { existing[idx] = project; updated++; }
        else { existing.push(project); added++; }
      });
      localStorage.setItem('iqcode-projects', JSON.stringify(existing));
      loadProjects();
      showToast(`📥 ${added} جديد، ${updated} محدّث`);
    } catch (err) {
      showToast('❌ ملف غير صالح', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ============================================================
   تنزيل
   ============================================================ */
function downloadCode() {
  const lang = LANGUAGES[currentLang];
  if (!lang) return;
  const code = codeEditor.value;
  const name = (document.getElementById('projectName').value.trim() || 'project')
    .replace(/[^a-zA-Z0-9_\u0600-\u06FF-]/g, '_');
  const filename = `${name}.${lang.fileExt}`;
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`⬇ تم تنزيل ${filename}`);
}

/* ============================================================
   الإشعارات
   ============================================================ */
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.className = 'toast', 2800);
}

/* ============================================================
   القائمة الجانبية
   ============================================================ */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* ============================================================
   شريط التقسيم
   ============================================================ */
function initDivider() {
  const divider = document.getElementById('divider');
  const outputSection = document.getElementById('outputSection');
  let isDragging = false;
  function start(e) { isDragging = true; e.preventDefault(); }
  function end() { isDragging = false; }
  function move(y) {
    if (!isDragging) return;
    const wrapper = document.querySelector('.editor-wrapper');
    const rect = wrapper.getBoundingClientRect();
    const newHeight = rect.bottom - y - 25;
    if (newHeight > 100 && newHeight < rect.height - 100) {
      outputSection.style.height = newHeight + 'px';
    }
  }
  divider.addEventListener('mousedown', start);
  document.addEventListener('mouseup', end);
  document.addEventListener('mousemove', e => move(e.clientY));
  divider.addEventListener('touchstart', start, { passive: false });
  document.addEventListener('touchend', end);
  document.addEventListener('touchmove', e => move(e.touches[0].clientY), { passive: true });
}

/* ============================================================
   اختصارات
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode();
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveProject();
  }
});
