<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO -->
    <meta name="description" content="İQmobil - دليلك لمقارنة أسعار ومواصفات الهواتف الذكية والأجهزة اللوحية والساعات الذكية في 8 دول عربية">
    <meta name="keywords" content="هواتف, أسعار, مواصفات, مقارنة, İQmobil, smartphones, prices">
    <meta name="author" content="İQmobil">
    
    <!-- Open Graph (للمشاركة على السوشيال ميديا) -->
    <meta property="og:title" content="İQmobil | دليل الأجهزة الذكية">
    <meta property="og:description" content="دليلك الشامل لمقارنة أسعار ومواصفات الأجهزة الذكية">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://starmusic1167.github.io/iqmobile/">
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="İQmobil">
    <meta name="twitter:description" content="دليلك الشامل لمقارنة الأجهزة الذكية">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
    
    <!-- خط Cairo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <title>İQmobil | دليل الأجهزة الذكية</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/layout.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="assets/css/pages.css">
</head>
<body>

    <!-- ============ الشريط العلوي ============ -->
    <div class="top-bar">
        🔥 أحدث الأسعار محدثة يومياً في 8 دول عربية
    </div>

    <!-- ============ الهيدر ============ -->
    <header>
        <div class="navbar">
            <a class="logo" data-nav="home">
                İQ<span>mobil</span>
            </a>
            
            <nav>
                <ul id="mainNav">
                    <li><a data-nav="home" class="active">الرئيسية</a></li>
                    <li><a data-category="phone">الهواتف</a></li>
                    <li><a data-category="tablet">الأجهزة اللوحية</a></li>
                    <li><a data-category="watch">الساعات</a></li>
                    <li><a data-nav="compare">المقارنة</a></li>
                    <li><a data-nav="admin">لوحة التحكم</a></li>
                </ul>
            </nav>

            <select class="country-selector" id="countrySelect" aria-label="اختر الدولة"></select>

            <div class="search-box">
                <input type="text" id="mainSearch" placeholder="ابحث عن جهاز..." aria-label="بحث">
                <button type="button" aria-label="زر البحث">🔍</button>
            </div>
        </div>

        <!-- شريط الماركات -->
        <div class="categories-bar">
            <ul class="categories-list" id="brandsBar"></ul>
        </div>
    </header>

    <!-- ============ الصفحات ============ -->
    <main>
        <!-- صفحة الرئيسية -->
        <section class="page active" id="page-home"></section>

        <!-- صفحة تفاصيل الجهاز -->
        <section class="page" id="page-device"></section>

        <!-- صفحة المقارنة -->
        <section class="page" id="page-compare"></section>

        <!-- صفحة لوحة التحكم -->
        <section class="page" id="page-admin"></section>
    </main>

    <!-- ============ شريط المقارنة العائم ============ -->
    <div class="compare-bar" id="compareBar">
        <div class="compare-bar-items" id="compareBarItems"></div>
        <button class="compare-bar-btn" data-action="go-compare">قارن الآن ←</button>
    </div>

    <!-- ============ الفوتر ============ -->
    <footer>
        <div class="footer-content" id="footerContent"></div>
        <div class="footer-bottom">
            © <span id="currentYear">2026</span> İQmobil - جميع الحقوق محفوظة
        </div>
    </footer>

    <!-- ============ JavaScript Modules ============ -->
    
    <!-- 1. البيانات -->
    <script src="assets/js/data/countries.js"></script>
    <script src="assets/js/data/devices.js"></script>
    <script src="assets/js/data/reviews.js"></script>

    <!-- 2. النواة -->
    <script src="assets/js/core/storage.js"></script>
    <script src="assets/js/core/helpers.js"></script>
    <script src="assets/js/core/state.js"></script>

    <!-- 3. الوحدات -->
    <script src="assets/js/modules/router.js"></script>
    <script src="assets/js/modules/home.js"></script>
    <script src="assets/js/modules/device.js"></script>
    <script src="assets/js/modules/compare.js"></script>
    <script src="assets/js/modules/admin.js"></script>

    <!-- 4. نقطة البداية -->
    <script src="assets/js/app.js"></script>
</body>
</html>
