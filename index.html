<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İQCODE</title>
<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  background: #0d1117;
  color: #e6edf3;
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}

/* ========= الشريط العلوي ========= */
#topbar {
  background: #161b22;
  border-bottom: 1px solid #30363d;
  padding: 8px;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

button {
  background: #21262d;
  color: #e6edf3;
  border: 1px solid #30363d;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 14px;
  cursor: pointer;
  min-height: 42px;
  min-width: 42px;
  font-weight: bold;
}

button:hover {
  background: #30363d;
}

button:active {
  transform: scale(0.95);
}

button.green {
  background: #238636;
  border-color: #2ea043;
  color: white;
}

button.blue {
  background: #1f6feb;
  border-color: #388bfd;
  color: white;
}

button.purple {
  background: #8957e5;
  border-color: #a371f7;
  color: white;
}

button.red {
  background: #da3633;
  border-color: #f85149;
  color: white;
}

select, input {
  background: #21262d;
  color: #e6edf3;
  border: 1px solid #30363d;
  padding: 10px;
  border-radius: 6px;
  font-size: 14px;
  min-height: 42px;
}

select:focus, input:focus {
  outline: none;
  border-color: #58a6ff;
}

#langSelect {
  flex: 1;
  min-width: 120px;
}

#projectName {
  flex: 1;
  min-width: 100px;
}

/* ========= القائمة الجانبية ========= */
#sidebar {
  position: fixed;
  top: 0;
  right: -280px;
  width: 280px;
  height: 100vh;
  background: #161b22;
  border-left: 1px solid #30363d;
  z-index: 1000;
  transition: right 0.25s;
  display: flex;
  flex-direction: column;
}

#sidebar.open {
  right: 0;
}

.sidebar-header {
  padding: 20px;
  border-bottom: 1px solid #30363d;
  font-size: 24px;
  font-weight: 900;
  background: linear-gradient(90deg, #58a6ff, #a855f7);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.menu-item {
  padding: 16px 20px;
  cursor: pointer;
  border-bottom: 1px solid #21262d;
  font-size: 15px;
  font-weight: bold;
  display: flex;
  align-items: center;
  gap: 10px;
}

.menu-item:hover {
  background: #21262d;
}

.menu-item.active {
  background: #1f6feb;
  color: white;
}

#overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.6);
  z-index: 999;
}

#overlay.show {
  display: block;
}

/* ========= المحتوى الرئيسي ========= */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  position: relative;
}

.page {
  display: none;
  flex-direction: column;
  height: 100%;
  overflow: hidden;
}

.page.active {
  display: flex;
}

/* ========= المحرر ========= */
#editorBox {
  flex: 1;
  display: flex;
  overflow: hidden;
  background: #0d1117;
  min-height: 150px;
}

#lineNumbers {
  background: #161b22;
  color: #6e7681;
  padding: 10px 6px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.5;
  text-align: right;
  min-width: 44px;
  overflow: hidden;
  border-left: 1px solid #30363d;
  user-select: none;
}

#codeEditor {
  flex: 1;
  background: #0d1117;
  color: #e6edf3;
  border: none;
  padding: 10px;
  font-family: Consolas, monospace;
  font-size: 14px;
  line-height: 1.5;
  resize: none;
  outline: none;
  direction: ltr;
  text-align: left;
  white-space: pre;
  overflow: auto;
}

/* ========= قسم المخرجات ========= */
#outputBox {
  height: 40%;
  background: #161b22;
  border-top: 1px solid #30363d;
  display: flex;
  flex-direction: column;
  min-height: 120px;
}

#tabs {
  display: flex;
  background: #0d1117;
  border-bottom: 1px solid #30363d;
  overflow-x: auto;
}

.tab {
  padding: 12px 18px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  white-space: nowrap;
  border-bottom: 2px solid transparent;
  color: #8b949e;
}

.tab.active {
  color: #58a6ff;
  border-bottom-color: #58a6ff;
  background: #161b22;
}

.tab-badge {
  background: #da3633;
  color: white;
  font-size: 11px;
  padding: 1px 6px;
  border-radius: 8px;
  margin-right: 4px;
}

.tab-content {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  font-family: Consolas, monospace;
  font-size: 13px;
  white-space: pre-wrap;
  direction: ltr;
  text-align: left;
  line-height: 1.5;
}

.tab-content.hidden {
  display: none;
}

#previewFrame {
  width: 100%;
  height: 100%;
  border: none;
  background: white;
}

#stdin {
  width: 100%;
  height: 100%;
  background: #0d1117;
  color: #e6edf3;
  border: none;
  padding: 12px;
  font-family: monospace;
  font-size: 13px;
  resize: none;
  outline: none;
}

/* ========= الأخطاء ========= */
.error-item {
  background: rgba(248,81,73,0.1);
  border-right: 3px solid #f85149;
  padding: 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  direction: rtl;
  text-align: right;
}

.error-item.warning {
  border-right-color: #d29922;
  background: rgba(210,153,34,0.1);
}

.error-item .err-header {
  font-weight: bold;
  color: #f85149;
  margin-bottom: 6px;
  font-size: 13px;
}

.error-item.warning .err-header {
  color: #d29922;
}

.error-item .err-msg {
  font-family: monospace;
  font-size: 12px;
  background: #0d1117;
  padding: 8px;
  border-radius: 4px;
  direction: ltr;
  text-align: left;
  word-break: break-word;
}

.error-item .err-fix {
  margin-top: 8px;
  padding: 8px;
  background: rgba(63,185,80,0.15);
  border-right: 3px solid #3fb950;
  border-radius: 4px;
  color: #7ee787;
  font-size: 12px;
}

/* ========= النصائح ========= */
#tipsContainer {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}

.tip-section {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 14px;
}

.tip-section h3 {
  color: #a855f7;
  margin-bottom: 12px;
  font-size: 16px;
  padding-bottom: 8px;
  border-bottom: 1px dashed #30363d;
}

.tip-func {
  background: #21262d;
  padding: 12px;
  border-radius: 8px;
  margin-bottom: 10px;
  border-right: 3px solid #58a6ff;
}

.tip-name {
  color: #d29922;
  font-family: monospace;
  font-weight: bold;
  font-size: 14px;
  display: inline-block;
  background: rgba(210,153,34,0.1);
  padding: 3px 8px;
  border-radius: 4px;
  margin-bottom: 8px;
  direction: ltr;
}

.tip-desc {
  color: #e6edf3;
  font-size: 13px;
  margin-bottom: 8px;
  line-height: 1.5;
}

.tip-example {
  background: #0d1117;
  padding: 10px;
  border-radius: 6px;
  font-family: monospace;
  font-size: 12px;
  color: #7ee787;
  white-space: pre;
  overflow-x: auto;
  margin-bottom: 8px;
  direction: ltr;
  text-align: left;
  border: 1px solid #30363d;
}

.tip-insert {
  background: #1f6feb;
  border: none;
  color: white;
  padding: 7px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  font-weight: bold;
  min-height: 32px;
}

/* ========= المشاريع ========= */
#projectsContainer {
  padding: 16px;
  overflow-y: auto;
  flex: 1;
}

.project-card {
  background: #161b22;
  border: 1px solid #30363d;
  border-radius: 10px;
  padding: 14px;
  margin-bottom: 12px;
}

.project-card h3 {
  color: #e6edf3;
  margin-bottom: 6px;
  font-size: 15px;
  word-break: break-word;
}

.project-card .proj-meta {
  color: #8b949e;
  font-size: 12px;
  margin-bottom: 10px;
}

.project-card .proj-lang {
  display: inline-block;
  background: #8957e5;
  color: white;
  padding: 3px 10px;
  border-radius: 10px;
  font-size: 11px;
  margin-bottom: 8px;
  font-weight: bold;
}

.project-card .proj-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.project-card .proj-actions button {
  flex: 1;
  min-height: 38px;
  font-size: 13px;
}

/* ========= شريط الحالة ========= */
#statusBar {
  background: #161b22;
  border-top: 1px solid #30363d;
  padding: 6px 12px;
  font-size: 11px;
  color: #8b949e;
  display: flex;
  justify-content: space-between;
}

/* ========= Toast ========= */
#toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #238636;
  color: white;
  padding: 12px 24px;
  border-radius: 8px;
  font-weight: bold;
  font-size: 14px;
  z-index: 2000;
  transition: transform 0.3s;
  opacity: 0;
  pointer-events: none;
  max-width: 90%;
  text-align: center;
}

#toast.show {
  transform: translateX(-50%) translateY(0);
  opacity: 1;
}

#toast.error {
  background: #da3633;
}

#toast.info {
  background: #1f6feb;
}

/* ========= الجوال ========= */
@media (max-width: 600px) {
  #topbar {
    padding: 6px;
    gap: 4px;
  }
  
  button {
    padding: 8px 10px;
    font-size: 13px;
    min-height: 40px;
  }
  
  select, input {
    font-size: 13px;
    padding: 8px;
    min-height: 40px;
  }
  
  #projectName {
    display: none;
  }
  
  #langSelect {
    flex: 2;
  }
}
</style>
</head>
<body>

<!-- القائمة الجانبية -->
<div id="sidebar">
  <div class="sidebar-header">İQCODE</div>
  <div class="menu-item active" data-page="editor">💻 المحرر</div>
  <div class="menu-item" data-page="tips">💡 النصائح والدوال</div>
  <div class="menu-item" data-page="projects">📁 مشاريعي</div>
  <div style="padding: 16px; margin-top: auto;">
    <button id="themeBtn" style="width:100%; margin-bottom:8px;">🌙 الوضع الليلي</button>
    <button id="autoRunBtn" style="width:100%; background:#238636; color:white;">⚡ تشغيل تلقائي: مفعّل</button>
  </div>
</div>

<!-- الخلفية المعتمة -->
<div id="overlay"></div>

<!-- الشريط العلوي -->
<div id="topbar">
  <button id="menuBtn" title="القائمة">☰</button>
  <select id="langSelect"></select>
  <input type="text" id="projectName" value="my_project" placeholder="اسم المشروع">
  <button id="runBtn" class="green">▶ تشغيل</button>
  <button id="saveBtn" class="blue" title="حفظ">💾</button>
  <button id="downloadBtn" class="purple" title="تنزيل">⬇</button>
</div>

<!-- المحتوى الرئيسي -->
<div id="main">

  <!-- صفحة المحرر -->
  <div class="page active" id="page-editor">
    <div id="editorBox">
      <div id="lineNumbers">1</div>
      <textarea id="codeEditor" spellcheck="false"></textarea>
    </div>
    <div id="outputBox">
      <div id="tabs">
        <div class="tab active" data-tab="output">📤 المخرجات</div>
        <div class="tab" data-tab="errors">🐛 الأخطاء <span class="tab-badge" id="errorBadge" style="display:none">0</span></div>
        <div class="tab" data-tab="input">⌨️ الإدخال</div>
      </div>
      <div class="tab-content" id="tab-output">اضغط "تشغيل" لبدء التنفيذ...</div>
      <div class="tab-content hidden" id="tab-errors">✅ لا توجد أخطاء</div>
      <div class="tab-content hidden" id="tab-input" style="padding:0">
        <textarea id="stdin" placeholder="اكتب الإدخال هنا..."></textarea>
      </div>
    </div>
    <div id="statusBar">
      <span id="statusText">جاهز</span>
      <span id="engineInfo">HTML</span>
    </div>
  </div>

  <!-- صفحة النصائح -->
  <div class="page" id="page-tips">
    <div style="padding: 12px; background: #161b22; border-bottom: 1px solid #30363d;">
      <select id="tipsLangSelect" style="width:100%"></select>
    </div>
    <div id="tipsContainer"></div>
  </div>

  <!-- صفحة المشاريع -->
  <div class="page" id="page-projects">
    <div style="padding: 12px; background: #161b22; border-bottom: 1px solid #30363d; display:flex; gap:8px; flex-wrap:wrap;">
      <button id="exportBtn" class="blue" style="flex:1">📤 تصدير</button>
      <button id="importBtn" class="purple" style="flex:1">📥 استيراد</button>
      <button id="clearBtn" class="red" style="flex:1">🗑 مسح الكل</button>
      <input type="file" id="importFile" accept=".json" style="display:none">
    </div>
    <div id="projectsContainer"></div>
  </div>

</div>

<!-- إشعار -->
<div id="toast"></div>

<script>
/* ============================================================
   İQCODE v10.0 - نسخة بسيطة مضمونة
   ============================================================ */

// المتغيرات
var currentLang = 'html';

var TIPS = {

/* ============================================================
   أدوات مساعدة
   ============================================================ */

function $(id) {
  return document.getElementById(id);
}

function toast(msg, type) {
  var t = $('toast');
  t.textContent = msg;
  t.className = 'show' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(function() {
    t.className = '';
  }, 2000);
}

function escHtml(t) {
  var d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

/* ============================================================
   تحديث أرقام الأسطر
   ============================================================ */

function updateLineNumbers() {
  var lines = $('codeEditor').value.split('\n');
  var html = '';
  for (var i = 1; i <= lines.length; i++) {
    var cls = errorLines.indexOf(i) !== -1 ? 'style="color:#f85149;font-weight:bold"' : '';
    html += '<div ' + cls + '>' + i + '</div>';
  }
  $('lineNumbers').innerHTML = html;
  $('lineNumbers').scrollTop = $('codeEditor').scrollTop;
}

/* ============================================================
   تشغيل الكود
   ============================================================ */

function runCode(manual) {
  var lang = LANGUAGES[currentLang];
  var code = $('codeEditor').value;
  
  if (!code.trim()) {
    showOutput('⚠️ لا يوجد كود');
    return;
  }
  
  if (lang.engine === 'web') {
    runWeb(code);
  } else if (lang.engine === 'markdown') {
    runMarkdown(code);
  } else if (lang.engine === 'json') {
    runJSON(code);
  } else if (lang.engine === 'yaml') {
    runYAML(code);
  } else if (lang.engine === 'xml') {
    runXML(code);
  } else if (lang.engine === 'python') {
    runPython(code);
  } else if (lang.engine === 'sql') {
    runSQL(code);
  }
  
  // تحديث شريط الحالة
  $('statusText').textContent = 'تم التنفيذ';
}

/* ============================================================
   Web Engine (HTML/CSS/JS)
   ============================================================ */

function runWeb(code) {
  var out = $('tab-output');
  out.innerHTML = '';
  
  // إنشاء iframe جديد
  var frame = document.createElement('iframe');
  frame.id = 'previewFrame';
  frame.sandbox = 'allow-scripts allow-modals allow-forms allow-popups';
  out.appendChild(frame);
  
  var html = code;
  if (currentLang === 'css' && code.toLowerCase().indexOf('<html') === -1) {
    html = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>' + code + '</style></head><body><h1>تجربة CSS</h1><p>نص تجريبي</p><div class="card">صندوق</div><button>زر</button></body></html>';
  }
  
  // إضافة sccript لالتقاط console
  var consoleScript = '<script>' +
    '(function(){' +
    'var send=function(t,a){' +
    'try{window.parent.postMessage({type:"console",level:t,args:Array.from(a).map(function(x){' +
    'if(typeof x==="object"){try{return JSON.stringify(x);}catch(e){return String(x);}}' +
    'return String(x);' +
    '}).join(" ")},"*");}catch(e){}};' +
    'var _l=console.log,_e=console.error,_w=console.warn;' +
    'console.log=function(){send("log",arguments);_l.apply(console,arguments);};' +
    'console.error=function(){send("error",arguments);_e.apply(console,arguments);};' +
    'console.warn=function(){send("warn",arguments);_w.apply(console,arguments);};' +
    'window.addEventListener("error",function(ev){send("error",["❌ "+ev.message+" (سطر "+ev.lineno+")"]);});' +
    '})();' +
    '<\/script>';
  
  if (html.indexOf('</head>') !== -1) {
    html = html.replace('</head>', consoleScript + '</head>');
  } else if (html.indexOf('<body') !== -1) {
    html = html.replace('<body', consoleScript + '<body');
  } else {
    html = consoleScript + html;
  }
  
  frame.srcdoc = html;
  
  // استقبال رسائل console
  window.onmessage = function(e) {
    if (e.data && e.data.type === 'console') {
      var level = e.data.level;
      var text = e.data.args;
      if (level === 'error') {
        var errBox = $('tab-errors');
        if (errBox.innerHTML.indexOf('لا توجد أخطاء') !== -1) {
          errBox.innerHTML = '';
        }
        errBox.innerHTML += '<div class="error-item"><div class="err-header">❌ خطأ تشغيل</div><div class="err-msg">' + escHtml(text) + '</div></div>';
        var badge = $('errorBadge');
        badge.style.display = 'inline-block';
        badge.textContent = (parseInt(badge.textContent) || 0) + 1;
      }
    }
  };
  
  // التبديل لتبويب المخرجات
  showTab('output');
}

/* ============================================================
   Markdown
   ============================================================ */

function runMarkdown(code) {
  var html = code
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#1c2330;color:#7ee787;padding:12px;border-radius:8px;overflow-x:auto"><code>$2</code></pre>')
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/`([^`]+)`/g, '<code style="background:#1c2330;color:#f85149;padding:2px 6px;border-radius:4px">$1</code>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" style="color:#58a6ff">$1</a>')
    .replace(/^- \[x\] (.+)$/gm, '<li style="list-style:none">✅ $1</li>')
    .replace(/^- \[ \] (.+)$/gm, '<li style="list-style:none">⬜ $1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/\n/g, '<br>');
  
  html = html.replace(/(<li>.*<\/li>)/s, '<ul style="padding-right:20px">$1</ul>');
  
  var full = '<!DOCTYPE html><html><head><meta charset="UTF-8"><style>body{font-family:Arial;padding:24px;line-height:1.7;background:white;color:#222}h1{color:#0969da;border-bottom:2px solid #0969da;padding-bottom:8px}h2{color:#8250df;margin-top:24px}</style></head><body>' + html + '</body></html>';
  
  var out = $('tab-output');
  out.innerHTML = '';
  var frame = document.createElement('iframe');
  frame.id = 'previewFrame';
  frame.srcdoc = full;
  out.appendChild(frame);
  showTab('output');
}

/* ============================================================
   JSON
   ============================================================ */

function runJSON(code) {
  try {
    var obj = JSON.parse(code);
    var out = '✅ JSON صالح!\n\n';
    out += 'الأحرف: ' + code.length + '\n';
    out += 'الأسطر: ' + code.split('\n').length + '\n\n';
    out += '📄 النسخة المنسقة:\n' + JSON.stringify(obj, null, 2);
    showOutput(out);
    clearErrors();
  } catch (e) {
    showOutput('❌ JSON غير صالح:\n\n' + e.message);
    showError('JSON غير صالح', e.message, 'تحقق من الفواصل والعلامات المزدوجة');
  }
}

/* ============================================================
   YAML
   ============================================================ */

function runYAML(code) {
  showOutput('📄 YAML\n\n' + code);
}

/* ============================================================
   XML
   ============================================================ */

function runXML(code) {
  try {
    var parser = new DOMParser();
    var doc = parser.parseFromString(code, 'text/xml');
    var err = doc.querySelector('parsererror');
    if (err) {
      showOutput('❌ XML غير صالح:\n\n' + err.textContent);
      showError('XML غير صالح', err.textContent, 'تأكد من إغلاق الوسوم');
      return;
    }
    var out = '✅ XML صالح!\n\n';
    out += 'الجذر: ' + doc.documentElement.nodeName + '\n';
    out += 'العناصر: ' + doc.getElementsByTagName('*').length;
    showOutput(out);
    clearErrors();
  } catch (e) {
    showOutput('❌ ' + e.message);
  }
}

/* ============================================================
   Python (Pyodide)
   ============================================================ */

var pyodideInstance = null;

function runPython(code) {
  if (pyodideInstance) {
    executePython(code);
    return;
  }
  
  showOutput('⏳ تحميل محرك Python...\n(مرة واحدة، ~10MB)');
  
  var script = document.createElement('script');
  script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
  script.onload = function() {
    window.loadPyodide({
      indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
    }).then(function(py) {
      pyodideInstance = py;
      executePython(code);
    }).catch(function(err) {
      showOutput('❌ فشل تحميل Python:\n' + err.message);
    });
  };
  script.onerror = function() {
    showOutput('❌ فشل تحميل Python - تحقق من الإنترنت');
  };
  document.head.appendChild(script);
}

function executePython(code) {
  try {
    var py = pyodideInstance;
    py.runPython('import sys, io\n_buf = io.StringIO()\nsys.stdout = _buf\nsys.stderr = _buf');
    var output = '', errText = '';
    try {
      py.runPython(code);
      output = py.runPython('_buf.getvalue()');
    } catch (e) {
      errText = e.message || String(e);
      try { output = py.runPython('_buf.getvalue()'); } catch(_) {}
    } finally {
      py.runPython('sys.stdout = sys.__stdout__\nsys.stderr = sys.__stderr__');
    }
    
    if (errText) {
      showOutput(output || '❌ خطأ');
      var lineMatch = errText.match(/line (\d+)/);
      var lineNum = lineMatch ? lineMatch[1] : null;
      showError('Python خطأ' + (lineNum ? ' - السطر ' + lineNum : ''), errText, getPythonSuggestion(errText));
      if (lineNum) {
        errorLines = [parseInt(lineNum)];
        updateLineNumbers();
      }
    } else {
      showOutput(output || '✅ تم بنجاح');
      clearErrors();
    }
  } catch (e) {
    showOutput('❌ ' + e.message);
  }
}

function getPythonSuggestion(msg) {
  var m = msg.toLowerCase();
  if (m.indexOf('indentation') !== -1) return 'تحقق من المسافات البادئة';
  if (m.indexOf('syntax') !== -1) return 'خطأ في الصياغة';
  if (m.indexOf('nameerror') !== -1) return 'متغير غير معرّف';
  if (m.indexOf('typeerror') !== -1) return 'خطأ في نوع البيانات';
  if (m.indexOf('zerodivision') !== -1) return 'القسمة على صفر';
  return 'تحقق من الكود';
}

/* ============================================================
   SQL (sql.js)
   ============================================================ */

var sqlInstance = null;

function runSQL(code) {
  if (sqlInstance) {
    executeSQL(code);
    return;
  }
  
  showOutput('⏳ تحميل SQLite...');
  
  var script = document.createElement('script');
  script.src = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';
  script.onload = function() {
    window.initSqlJs({
      locateFile: function(f) {
        return 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/' + f;
      }
    }).then(function(SQL) {
      sqlInstance = SQL;
      executeSQL(code);
    }).catch(function(err) {
      showOutput('❌ فشل تحميل SQL: ' + err.message);
    });
  };
  script.onerror = function() {
    showOutput('❌ فشل تحميل SQL');
  };
  document.head.appendChild(script);
}

function executeSQL(code) {
  try {
    var db = new sqlInstance.Database();
    var stmts = code.split(';').map(function(s) { return s.trim(); }).filter(function(s) { return s; });
    var out = '';
    var errors = [];
    
    for (var i = 0; i < stmts.length; i++) {
      try {
        var r = db.exec(stmts[i]);
        if (r.length > 0) {
          for (var j = 0; j < r.length; j++) {
            out += '📋 ' + r[j].columns.join(' | ') + '\n';
            out += '─────\n';
            for (var k = 0; k < r[j].values.length; k++) {
              out += r[j].values[k].map(function(v) { return String(v == null ? 'NULL' : v); }).join(' | ') + '\n';
            }
            out += '\n';
          }
        } else {
          out += '✅ تم\n';
        }
      } catch (e) {
        errors.push(e.message);
        out += '❌ ' + e.message + '\n';
      }
    }
    
    showOutput(out || '✅ تم');
    if (errors.length > 0) {
      showError('SQL خطأ', errors.join('\n'), 'تحقق من الصياغة');
    } else {
      clearErrors();
    }
  } catch (e) {
    showOutput('❌ ' + e.message);
  }
}

/* ============================================================
   Linter - فحص الأخطاء الفوري
   ============================================================ */

function runLinter() {
  var code = $('codeEditor').value;
  var issues = [];
  
  if (currentLang === 'javascript') {
    lintJS(code, issues);
  } else if (currentLang === 'python') {
    lintPython(code, issues);
  } else if (currentLang === 'html') {
    lintHTML(code, issues);
  } else if (currentLang === 'json') {
    lintJSON(code, issues);
  }
  
  errorLines = issues.filter(function(i) { return i.severity === 'error'; }).map(function(i) { return i.line; });
  updateLineNumbers();
  
  if (issues.length > 0) {
    var err = $('tab-errors');
    var html = '';
    for (var i = 0; i < issues.length; i++) {
      var iss = issues[i];
      html += '<div class="error-item' + (iss.severity === 'warning' ? ' warning' : '') + '">' +
        '<div class="err-header">' + (iss.severity === 'error' ? '❌' : '⚠️') + ' السطر ' + iss.line + '</div>' +
        '<div class="err-msg">' + escHtml(iss.message) + '</div>' +
        (iss.suggestion ? '<div class="err-fix">💡 ' + escHtml(iss.suggestion) + '</div>' : '') +
        '</div>';
    }
    err.innerHTML = html;
    var badge = $('errorBadge');
    badge.style.display = 'inline-block';
    badge.textContent = issues.length;
  } else {
    var err = $('tab-errors');
    err.textContent = '✅ لا توجد أخطاء';
    var badge = $('errorBadge');
    badge.style.display = 'none';
  }
}

function lintJS(code, issues) {
  var lines = code.split('\n');
  var stack = [];
  for (var i = 0; i < lines.length; i++) {
    var ln = i + 1;
    var trimmed = lines[i].trim();
    if (trimmed.indexOf('//') === 0) continue;
    
    if (/\bvar\s+\w+/.test(lines[i])) {
      issues.push({ line: ln, severity: 'warning', message: 'استخدام var', suggestion: 'استخدم let أو const' });
    }
    if (/[^=!<>]==[^=]/.test(lines[i]) && lines[i].indexOf('===') === -1) {
      issues.push({ line: ln, severity: 'warning', message: 'استخدام ==', suggestion: 'استخدم ===' });
    }
  }
}

function lintPython(code, issues) {
  var lines = code.split('\n');
  for (var i = 0; i < lines.length; i++) {
    var ln = i + 1;
    var trimmed = lines[i].trim();
    if (trimmed.indexOf('#') === 0 || !trimmed) continue;
    
    if (/^(if|elif|else|for|while|def|class|try|except|finally|with)\b/.test(trimmed) && trimmed.slice(-1) !== ':') {
      issues.push({ line: ln, severity: 'error', message: 'نقطتين : مفقودة', suggestion: 'أضف :' });
    }
    if (/^print\s+["']/.test(trimmed) && trimmed.indexOf('(') === -1) {
      issues.push({ line: ln, severity: 'warning', message: 'print بدون أقواس', suggestion: 'استخدم print("نص")' });
    }
  }
}

function lintHTML(code, issues) {
  var lines = code.split('\n');
  var stack = [];
  var voidTags = ['br','hr','img','input','meta','link'];
  for (var i = 0; i < lines.length; i++) {
    var ln = i + 1;
    var cleaned = lines[i].replace(/<!--[\s\S]*?-->/g, '');
    var re = /<\/?([a-zA-Z][a-zA-Z0-9]*)[^>]*?(\/?)>/g;
    var m;
    while ((m = re.exec(cleaned)) !== null) {
      var full = m[0];
      var tag = m[1].toLowerCase();
      var selfClose = m[2] === '/';
      if (full.indexOf('</') === 0) {
        if (stack.length === 0) {
          issues.push({ line: ln, severity: 'error', message: 'وسم إغلاق بدون فتح', suggestion: 'تحقق من الوسوم' });
        } else {
          stack.pop();
        }
      } else if (!selfClose && voidTags.indexOf(tag) === -1) {
        stack.push({ tag: tag, ln: ln });
      }
    }
  }
}

function lintJSON(code, issues) {
  if (!code.trim()) return;
  try {
    JSON.parse(code);
  } catch (e) {
    var m = e.message.match(/position (\d+)/);
    var ln = 1;
    if (m) ln = code.substring(0, parseInt(m[1])).split('\n').length;
    issues.push({ line: ln, severity: 'error', message: e.message, suggestion: 'تحقق من JSON' });
  }
}

function scheduleLint() {
  clearTimeout(lintTimer);
  lintTimer = setTimeout(runLinter, 500);
}

function scheduleAutoRun() {
  if (!autoRun) return;
  clearTimeout(autoRunTimer);
  autoRunTimer = setTimeout(function() { runCode(false); }, 1500);
}

/* ============================================================
   المشاريع
   ============================================================ */

function saveProject() {
  var name = $('projectName').value.trim() || 'مشروع';
  var code = $('codeEditor').value;
  if (!code.trim()) { toast('⚠️ لا يوجد كود', 'error'); return; }
  
  var projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  var idx = -1;
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].name === name) { idx = i; break; }
  }
  
  var project = {
    name: name,
    code: code,
    lang: currentLang,
    date: new Date().toISOString(),
    id: idx >= 0 ? projects[idx].id : Date.now()
  };
  
  if (idx >= 0) {
    projects[idx] = project;
    toast('💾 تم التحديث');
  } else {
    projects.push(project);
    toast('💾 تم الحفظ');
  }
  
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
}

function loadProjects() {
  var container = $('projectsContainer');
  var projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  
  if (projects.length === 0) {
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#8b949e;">📭 لا توجد مشاريع محفوظة</div>';
    return;
  }
  
  projects.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
  
  var html = '';
  for (var i = 0; i < projects.length; i++) {
    var p = projects[i];
    var lang = LANGUAGES[p.lang];
    html += '<div class="project-card">';
    html += '<span class="proj-lang">' + (lang ? lang.icon + ' ' + lang.name : p.lang) + '</span>';
    html += '<h3>' + escHtml(p.name) + '</h3>';
    html += '<div class="proj-meta">📅 ' + new Date(p.date).toLocaleString('ar-EG') + '</div>';
    html += '<div class="proj-actions">';
    html += '<button class="blue" data-open="' + p.id + '">📂 فتح</button>';
    html += '<button class="red" data-del="' + p.id + '">🗑 حذف</button>';
    html += '</div></div>';
  }
  container.innerHTML = html;
  
  container.querySelectorAll('[data-open]').forEach(function(b) {
    b.onclick = function() { openProject(parseInt(b.getAttribute('data-open'))); };
  });
  container.querySelectorAll('[data-del]').forEach(function(b) {
    b.onclick = function() { deleteProject(parseInt(b.getAttribute('data-del'))); };
  });
}

function openProject(id) {
  var projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  var p = null;
  for (var i = 0; i < projects.length; i++) {
    if (projects[i].id === id) { p = projects[i]; break; }
  }
  if (!p) return;
  
  currentLang = p.lang;
  $('langSelect').value = p.lang;
  $('projectName').value = p.name;
  $('codeEditor').value = p.code;
  updateLineNumbers();
  errorLines = [];
  
  // الانتقال للمحرر
  document.querySelectorAll('.menu-item').forEach(function(m) { m.classList.remove('active'); });
  document.querySelector('[data-page="editor"]').classList.add('active');
  document.querySelectorAll('.page').forEach(function(pg) { pg.classList.remove('active'); });
  $('page-editor').classList.add('active');
  closeSidebar();
  
  toast('📂 تم الفتح');
}

function deleteProject(id) {
  if (!confirm('حذف المشروع؟')) return;
  var projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  projects = projects.filter(function(p) { return p.id !== id; });
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
  loadProjects();
  toast('🗑 تم الحذف');
}

function clearAllProjects() {
  if (!confirm('حذف جميع المشاريع؟')) return;
  localStorage.removeItem('iqcode-projects');
  loadProjects();
  toast('🗑 تم المسح');
}

function exportProjects() {
  var projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  if (projects.length === 0) { toast('⚠️ لا توجد مشاريع', 'error'); return; }
  var blob = new Blob([JSON.stringify({ app: 'İQCODE', projects: projects }, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'iqcode_backup.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
  toast('📤 تم التصدير');
}

function importProjects(e) {
  var file = e.target.files[0];
  if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    try {
      var data = JSON.parse(ev.target.result);
      var imported = data.projects || data;
      if (!Array.isArray(imported)) throw new Error('صيغة غير صحيحة');
      
      var existing = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
      for (var i = 0; i < imported.length; i++) {
        var p = imported[i];
        if (!p.name || !p.code || !p.lang) continue;
        p.id = Date.now() + Math.random();
        existing.push(p);
      }
      localStorage.setItem('iqcode-projects', JSON.stringify(existing));
      loadProjects();
      toast('📥 تم الاستيراد: ' + imported.length);
    } catch (err) {
      toast('❌ ملف غير صالح', 'error');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

function downloadCode() {
  var lang = LANGUAGES[currentLang];
  var code = $('codeEditor').value;
  var name = ($('projectName').value.trim() || 'project').replace(/[^a-zA-Z0-9_\u0600-\u06FF-]/g, '_');
  var filename = name + '.' + lang.file;
  var blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function() { URL.revokeObjectURL(url); }, 100);
  toast('⬇ ' + filename);
}

function openSidebar() {

}

function closeSidebar() {

  $('overlay').classList.remove('show');
}

function toggleTheme() {

function toggleAutoRun() {

function changeLang() {

  scheduleAutoRun();

  // المحرر
  var codeEditor = $('codeEditor');
  if (codeEditor) {
    codeEditor.oninput = function() {
      updateLineNumbers();
      scheduleLint();
      scheduleAutoRun();
    };
    codeEditor.onscroll = function() {
      $('lineNumbers').scrollTop = codeEditor.scrollTop;
    };
    codeEditor.onkeydown = function(e) {
      if (e.key === 'Tab') {
        e.preventDefault();
        var s = codeEditor.selectionStart;
        codeEditor.value = codeEditor.value.substring(0, s) + '  ' + codeEditor.value.substring(codeEditor.selectionEnd);
        codeEditor.selectionStart = codeEditor.selectionEnd = s + 2;
        updateLineNumbers();
      }
    };
  }
  
  // اختصارات
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      runCode(true);
    }
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveProject();
    }
  });
  
  console.log('✅ All buttons wired');
}

function init() {
  console.log('🚀 İQCODE v10.0 starting...');
  
  // تعبئة قوائم اللغات
  var ls = $('langSelect');
  var tls = $('tipsLangSelect');
  var langs = Object.keys(LANGUAGES);
  for (var i = 0; i < langs.length; i++) {
    var key = langs[i];
    var lang = LANGUAGES[key];
    var o1 = document.createElement('option');
    o1.value = key;
    o1.textContent = lang.icon + ' ' + lang.name;
    ls.appendChild(o1);
    
    var o2 = document.createElement('option');
    o2.value = key;
    o2.textContent = lang.icon + ' ' + lang.name;
    tls.appendChild(o2);
  }
  ls.value = 'html';
  tls.value = 'html';
  
  // تحميل الكود الأولي
  $('codeEditor').value = STARTER.html;
  updateLineNumbers();
  
  // ربط كل الأزرار
  wireAllButtons();
  
  // ربط النصائح مبدئياً
  loadTips();
  
  // تشغيل أولي
  setTimeout(function() {
    runCode(false);
  }, 500);
  
  toast('✅ İQCODE جاهز!', 'info');
  console.log('✅ İQCODE ready');
}

// تشغيل بعد تحميل DOM
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}

</script>
</body>
</html>
