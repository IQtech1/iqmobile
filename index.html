<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İQCODE - محرر البرمجة الذكي</title>

<style>
:root[data-theme="dark"] {
  --bg: #0a0e14; --bg-2: #131820; --bg-3: #1c2330; --bg-4: #252d3d;
  --border: #2d3748; --border-2: #3d4a5c;
  --text: #e6edf3; --text-dim: #8b949e; --text-bright: #ffffff;
  --primary: #58a6ff; --primary-2: #1f6feb; --primary-glow: rgba(88,166,255,0.3);
  --success: #3fb950; --success-2: #2ea043;
  --danger: #f85149; --danger-2: #da3633;
  --warning: #d29922; --info: #58a6ff;
  --accent: #a855f7; --accent-2: #9333ea;
  --pink: #ec4899;
  --gradient: linear-gradient(135deg, #58a6ff, #a855f7, #ec4899);
  --gradient-success: linear-gradient(135deg, #3fb950, #2ea043);
  --shadow: 0 4px 20px rgba(0,0,0,0.4);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.5);
}
:root[data-theme="light"] {
  --bg: #ffffff; --bg-2: #f6f8fa; --bg-3: #eaeef2; --bg-4: #dfe3e8;
  --border: #d0d7de; --border-2: #b8c0c8;
  --text: #1f2328; --text-dim: #656d76; --text-bright: #000000;
  --primary: #0969da; --primary-2: #0550ae; --primary-glow: rgba(9,105,218,0.2);
  --success: #1a7f37; --success-2: #166534;
  --danger: #cf222e; --danger-2: #a40e26;
  --warning: #9a6700; --info: #0969da;
  --accent: #8250df; --accent-2: #6b21a8;
  --pink: #bf3989;
  --gradient: linear-gradient(135deg, #0969da, #8250df, #bf3989);
  --gradient-success: linear-gradient(135deg, #1a7f37, #166534);
  --shadow: 0 4px 20px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 40px rgba(0,0,0,0.15);
}

* { margin: 0; padding: 0; box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, -apple-system, Tahoma, sans-serif;
  -webkit-tap-highlight-color: transparent;
  transition: background-color 0.25s, color 0.25s, border-color 0.25s; }

body { background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
.app { display: flex; height: 100vh; }

/* ===================== القائمة الجانبية ===================== */
.sidebar {
  width: 280px; background: var(--bg-2);
  border-left: 1px solid var(--border);
  display: flex; flex-direction: column;
  transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); z-index: 100;
  box-shadow: -2px 0 10px rgba(0,0,0,0.1);
}
.sidebar-header { padding: 20px 18px; border-bottom: 1px solid var(--border); }
.logo {
  font-size: 28px; font-weight: 900;
  background: var(--gradient);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  letter-spacing: 2px; line-height: 1;
}
.tagline { font-size: 11px; color: var(--text-dim); margin-top: 6px; letter-spacing: 0.5px; }
.sidebar-nav { flex: 1; padding: 14px 10px; overflow-y: auto; }
.nav-item {
  display: flex; align-items: center; gap: 14px;
  padding: 14px 16px; border-radius: 12px; cursor: pointer;
  color: var(--text); font-size: 14px; font-weight: 600;
  margin-bottom: 6px; user-select: none;
  position: relative; overflow: hidden;
}
.nav-item::before {
  content: ''; position: absolute; inset: 0;
  background: var(--primary); opacity: 0; transition: opacity 0.3s;
}
.nav-item:hover { background: var(--bg-3); }
.nav-item.active {
  background: var(--gradient); color: white;
  box-shadow: 0 4px 15px var(--primary-glow);
}
.nav-item .icon { font-size: 20px; width: 24px; text-align: center; }
.nav-badge {
  margin-right: auto; background: var(--bg-4); color: var(--text-dim);
  font-size: 10px; padding: 2px 8px; border-radius: 10px;
  font-weight: bold;
}
.nav-item.active .nav-badge { background: rgba(255,255,255,0.25); color: white; }

.sidebar-footer { padding: 14px; border-top: 1px solid var(--border); }
.theme-toggle {
  width: 100%; padding: 12px; background: var(--bg-3);
  border: 1px solid var(--border); color: var(--text);
  border-radius: 10px; cursor: pointer; font-size: 13px;
  display: flex; align-items: center; justify-content: center; gap: 10px;
  font-weight: 600;
}
.theme-toggle:hover { border-color: var(--primary); background: var(--bg-4); }

.auto-run-toggle {
  width: 100%; padding: 12px; margin-bottom: 10px;
  background: var(--bg-3); border: 1px solid var(--border);
  color: var(--text); border-radius: 10px; cursor: pointer;
  font-size: 13px; display: flex; align-items: center;
  justify-content: space-between; font-weight: 600;
}
.auto-run-toggle.on {
  background: var(--gradient-success); color: white; border-color: transparent;
}
.switch {
  width: 36px; height: 20px; background: var(--bg-4);
  border-radius: 10px; position: relative; transition: background 0.3s;
}
.auto-run-toggle.on .switch { background: rgba(255,255,255,0.35); }
.switch::after {
  content: ''; position: absolute; width: 16px; height: 16px;
  background: white; border-radius: 50%; top: 2px; right: 2px;
  transition: transform 0.3s;
}
.auto-run-toggle.on .switch::after { transform: translateX(-16px); }

/* ===================== منطقة المحتوى ===================== */
.content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

.topbar {
  background: var(--bg-2); border-bottom: 1px solid var(--border);
  padding: 12px 16px; display: flex; align-items: center;
  gap: 10px; flex-wrap: wrap;
  box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}
.menu-btn {
  display: none; background: var(--bg-3); border: 1px solid var(--border);
  color: var(--text); padding: 10px 14px; border-radius: 10px;
  cursor: pointer; font-size: 18px;
}

select, button, input {
  background: var(--bg-3); color: var(--text);
  border: 1px solid var(--border); padding: 10px 14px;
  border-radius: 10px; font-size: 13px; cursor: pointer;
  outline: none; font-family: inherit; font-weight: 500;
}
input { cursor: text; min-width: 140px; }
select:hover, button:hover { border-color: var(--primary); background: var(--bg-4); }
button.primary {
  background: var(--gradient-success);
  border: none; color: white; font-weight: bold;
  box-shadow: 0 4px 15px rgba(63,185,80,0.3);
  padding: 10px 20px;
}
button.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(63,185,80,0.4); }
button.danger { background: var(--danger); border: none; color: white; }
button:disabled { opacity: 0.5; cursor: not-allowed; }

.lang-select {
  min-width: 180px; font-weight: 600;
  background: var(--bg-3);
}
.lang-select option { background: var(--bg-2); color: var(--text); padding: 8px; }

/* ===================== الصفحات ===================== */
.page { flex: 1; display: none; overflow: hidden; flex-direction: column; }
.page.active { display: flex; }

/* ===================== المحرر ===================== */
.editor-wrapper { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.editor-area {
  flex: 1; position: relative; overflow: hidden; min-height: 150px;
  display: flex; background: var(--bg);
}
.line-numbers {
  background: var(--bg-2); color: var(--text-dim);
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px; line-height: 1.65;
  padding: 14px 10px; text-align: right; user-select: none;
  overflow: hidden; min-width: 50px;
  border-left: 1px solid var(--border);
  direction: ltr; font-weight: 600;
}
.line-numbers .err-num {
  color: var(--danger); background: rgba(248,81,73,0.2);
  font-weight: bold; position: relative;
}
.line-numbers .err-num::before {
  content: '●'; color: var(--danger); margin-left: 4px;
  font-size: 10px;
}
.line-numbers .warn-num {
  color: var(--warning); background: rgba(210,153,34,0.15);
}
#codeEditor {
  flex: 1; width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  border: none; padding: 14px;
  font-family: 'Consolas', 'Monaco', monospace;
  font-size: 14px; line-height: 1.65;
  resize: none; outline: none; direction: ltr;
  text-align: left; tab-size: 2; white-space: pre;
  overflow: auto; caret-color: var(--primary);
}
#codeEditor::selection { background: var(--primary); color: white; }

.divider {
  height: 8px; background: var(--bg-2); cursor: row-resize;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
.divider::before {
  content: ''; width: 50px; height: 4px;
  background: var(--border-2); border-radius: 2px;
}
.divider:hover::before { background: var(--primary); }

/* ===================== قسم المخرجات ===================== */
.output-section {
  background: var(--bg-2); display: flex; flex-direction: column;
  height: 42%; overflow: hidden; flex-shrink: 0;
}
.tabs {
  display: flex; background: var(--bg);
  border-bottom: 1px solid var(--border); overflow-x: auto;
}
.tab {
  padding: 12px 18px; cursor: pointer;
  border-bottom: 3px solid transparent; font-size: 13px;
  white-space: nowrap; user-select: none; font-weight: 600;
  color: var(--text-dim); display: flex; align-items: center; gap: 6px;
  position: relative;
}
.tab:hover { color: var(--text); background: var(--bg-2); }
.tab.active {
  color: var(--primary); border-bottom-color: var(--primary);
  background: var(--bg-2);
}
.tab-badge {
  background: var(--danger); color: white;
  padding: 1px 7px; border-radius: 10px; font-size: 10px;
  font-weight: bold;
}
.tab-badge.warning { background: var(--warning); }
.tab-content {
  flex: 1; padding: 14px; overflow-y: auto;
  font-family: 'Consolas', monospace; font-size: 13px;
  line-height: 1.7; direction: ltr; text-align: left;
  white-space: pre-wrap; word-break: break-word;
}
.tab-content.hidden { display: none; }
#stdin {
  width: 100%; height: 100%; background: var(--bg);
  color: var(--text); border: none; padding: 14px;
  font-family: monospace; font-size: 13px;
  resize: none; outline: none;
}
#previewFrame { width: 100%; height: 100%; border: none; background: white; }

/* ===================== الأخطاء ===================== */
.error-item {
  background: linear-gradient(90deg, rgba(248,81,73,0.15), rgba(248,81,73,0.05));
  border-right: 4px solid var(--danger);
  padding: 14px 16px; margin-bottom: 10px;
  border-radius: 10px; direction: rtl; text-align: right;
  animation: slideIn 0.3s ease-out;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateX(20px); }
  to { opacity: 1; transform: translateX(0); }
}
.error-item.warning {
  border-right-color: var(--warning);
  background: linear-gradient(90deg, rgba(210,153,34,0.15), rgba(210,153,34,0.05));
}
.error-item.info {
  border-right-color: var(--info);
  background: linear-gradient(90deg, rgba(88,166,255,0.15), rgba(88,166,255,0.05));
}
.error-item .header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 8px;
}
.error-item .icon {
  font-size: 18px;
}
.error-item .line {
  color: var(--danger); font-weight: bold; font-size: 13px;
  background: rgba(248,81,73,0.2); padding: 3px 10px; border-radius: 6px;
}
.error-item.warning .line {
  color: var(--warning); background: rgba(210,153,34,0.2);
}
.error-item.info .line {
  color: var(--info); background: rgba(88,166,255,0.2);
}
.error-item .message {
  color: var(--text); margin-top: 6px;
  font-family: 'Consolas', monospace; font-size: 12.5px;
  direction: ltr; text-align: left;
  background: var(--bg); padding: 8px 12px; border-radius: 6px;
  border: 1px solid var(--border);
}
.error-item .suggestion {
  color: var(--success); margin-top: 10px;
  padding: 10px 14px; background: rgba(63,185,80,0.1);
  border-radius: 8px; font-size: 12.5px;
  border-right: 3px solid var(--success);
  font-weight: 500;
}
.error-item .suggestion::before {
  content: '💡 '; font-weight: bold;
}
.empty-state {
  text-align: center; color: var(--text-dim); padding: 40px 20px;
  direction: rtl; font-size: 14px;
}
.empty-state .big-icon {
  font-size: 60px; display: block; margin-bottom: 15px; opacity: 0.6;
}
.empty-state.success { color: var(--success); }

/* ===================== مؤشر التشغيل التلقائي ===================== */
.auto-indicator {
  display: flex; align-items: center; gap: 6px;
  font-size: 11px; color: var(--text-dim); padding: 4px 10px;
  background: var(--bg-3); border-radius: 20px;
  border: 1px solid var(--border);
}
.auto-indicator.active {
  background: var(--gradient-success); color: white;
  border-color: transparent;
}
.auto-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--success);
}
.auto-indicator.active .auto-dot {
  background: white;
  animation: pulse 1.2s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ===================== شريط الحالة ===================== */
.status-bar {
  background: var(--bg-3); border-top: 1px solid var(--border);
  padding: 6px 14px; font-size: 11.5px; color: var(--text-dim);
  display: flex; justify-content: space-between; align-items: center;
  font-weight: 500;
}
.status-left { display: flex; align-items: center; gap: 12px; }
.status-dot {
  display: inline-block; width: 9px; height: 9px;
  border-radius: 50%; background: var(--success);
  margin-left: 6px; box-shadow: 0 0 6px var(--success);
}
.status-dot.busy {
  background: var(--warning); box-shadow: 0 0 6px var(--warning);
  animation: pulse 1s infinite;
}
.status-dot.error { background: var(--danger); box-shadow: 0 0 6px var(--danger); }
.status-info {
  background: var(--bg-4); padding: 2px 8px; border-radius: 6px;
  font-family: 'Consolas', monospace;
}

/* ===================== النصائح ===================== */
.tips-container { flex: 1; overflow-y: auto; padding: 24px; }
.tips-lang-picker {
  background: linear-gradient(135deg, var(--bg-2), var(--bg-3));
  padding: 20px; border-radius: 16px;
  margin-bottom: 24px; display: flex; gap: 12px;
  align-items: center; flex-wrap: wrap;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
}
.tips-lang-picker label { font-weight: bold; font-size: 14px; }
.tips-lang-picker select {
  flex: 1; min-width: 220px; padding: 12px 16px;
  font-size: 14px; font-weight: 600;
}
.tips-content h2 {
  color: var(--text); margin-bottom: 20px; font-size: 24px;
  display: flex; align-items: center; gap: 10px;
  padding-bottom: 12px; border-bottom: 2px solid var(--border);
}
.tips-section {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 16px; padding: 20px; margin-bottom: 18px;
  box-shadow: var(--shadow);
}
.tips-section h3 {
  color: var(--accent); margin-bottom: 16px; font-size: 18px;
  display: flex; align-items: center; gap: 8px;
  padding-bottom: 10px; border-bottom: 1px dashed var(--border);
}
.func-item {
  background: var(--bg-3); padding: 16px; border-radius: 12px;
  margin-bottom: 12px; border-right: 4px solid var(--primary);
  transition: all 0.2s;
}
.func-item:hover {
  border-right-color: var(--accent);
  transform: translateX(-4px);
  box-shadow: var(--shadow);
}
.func-item .fname {
  color: var(--warning); font-family: 'Consolas', monospace;
  font-weight: bold; font-size: 14.5px;
  direction: ltr; text-align: left; display: block;
  margin-bottom: 8px;
  background: rgba(210,153,34,0.1);
  padding: 4px 10px; border-radius: 6px;
  display: inline-block;
}
.func-item .fdesc {
  color: var(--text); font-size: 13.5px; margin-bottom: 10px;
  line-height: 1.6;
}
.func-item .fexample {
  background: var(--bg); padding: 12px 14px; border-radius: 8px;
  font-family: 'Consolas', monospace; font-size: 12.5px;
  color: var(--success); direction: ltr; text-align: left;
  overflow-x: auto; white-space: pre; margin-bottom: 10px;
  border: 1px solid var(--border);
  line-height: 1.6;
}
.insert-btn {
  background: var(--primary-2); border: none; color: white;
  padding: 8px 16px; border-radius: 8px;
  font-size: 12px; cursor: pointer; font-weight: 600;
  transition: all 0.2s;
}
.insert-btn:hover {
  background: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px var(--primary-glow);
}

/* ===================== المشاريع ===================== */
.projects-container { flex: 1; overflow-y: auto; padding: 24px; }
.projects-header {
  display: flex; justify-content: space-between;
  align-items: center; margin-bottom: 24px;
  flex-wrap: wrap; gap: 12px;
  padding-bottom: 16px; border-bottom: 2px solid var(--border);
}
.projects-header h2 {
  color: var(--text); display: flex; align-items: center; gap: 10px;
}
.projects-header .actions { display: flex; gap: 10px; flex-wrap: wrap; }
.projects-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 18px;
}
.project-card {
  background: var(--bg-2); border: 1px solid var(--border);
  border-radius: 16px; padding: 18px;
  transition: all 0.25s;
  box-shadow: var(--shadow);
  position: relative; overflow: hidden;
}
.project-card::before {
  content: ''; position: absolute; top: 0; right: 0;
  width: 100%; height: 4px; background: var(--gradient);
}
.project-card:hover {
  border-color: var(--primary);
  transform: translateY(-4px);
  box-shadow: var(--shadow-lg);
}
.project-card h3 {
  color: var(--text); margin-bottom: 10px; font-size: 16px;
  word-break: break-word; font-weight: 700;
}
.project-card .meta {
  color: var(--text-dim); font-size: 12px; margin-bottom: 14px;
  display: flex; align-items: center; gap: 6px;
}
.project-card .lang-badge {
  background: var(--gradient); color: white;
  padding: 4px 12px; border-radius: 12px;
  font-size: 11px; display: inline-block; margin-bottom: 12px;
  font-weight: 700; letter-spacing: 0.5px;
}
.project-card .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.project-card .actions button {
  flex: 1; font-size: 12px; padding: 8px 10px;
  min-width: 70px; font-weight: 600;
}

/* ===================== الإشعارات ===================== */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--gradient-success); color: white;
  padding: 14px 28px; border-radius: 12px;
  box-shadow: var(--shadow-lg);
  opacity: 0; transition: all 0.35s cubic-bezier(0.4,0,0.2,1);
  z-index: 9999; font-size: 14px; font-weight: 600;
  max-width: 90%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast.error { background: linear-gradient(135deg, var(--danger), var(--danger-2)); }
.toast.info { background: linear-gradient(135deg, var(--primary), var(--primary-2)); }

/* ===================== الجوال ===================== */
@media (max-width: 768px) {
  .sidebar {
    position: fixed; top: 0; right: 0; height: 100vh;
    transform: translateX(100%);
    box-shadow: -8px 0 30px rgba(0,0,0,0.5);
    width: 260px;
  }
  .sidebar.open { transform: translateX(0); }
  .menu-btn { display: block; }
  .topbar { padding: 10px; gap: 8px; }
  select, button, input { font-size: 12px; padding: 9px 12px; }
  input { min-width: 90px; flex: 1; }
  .lang-select { min-width: 140px; }
  .tab { padding: 10px 14px; font-size: 12px; }
  .projects-grid { grid-template-columns: 1fr; }
  .tips-container, .projects-container { padding: 14px; }
  .logo { font-size: 22px; }
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.6);
    z-index: 99; display: none; backdrop-filter: blur(2px);
  }
  .overlay.show { display: block; }
  .status-bar { font-size: 10.5px; padding: 5px 10px; }
}
</style>
</head>
<body>

<div class="app">
  <!-- القائمة الجانبية -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo">İQCODE</div>
      <div class="tagline">محرر البرمجة الذكي • v7.0</div>
    </div>
    
    <nav class="sidebar-nav">
      <div class="nav-item active" data-page="editor">
        <span class="icon">💻</span>
        <span>المحرر</span>
        <span class="nav-badge">9 لغات</span>
      </div>
      <div class="nav-item" data-page="tips">
        <span class="icon">💡</span>
        <span>النصائح والدوال</span>
        <span class="nav-badge">200+</span>
      </div>
      <div class="nav-item" data-page="projects">
        <span class="icon">📁</span>
        <span>مشاريعي المحفوظة</span>
      </div>
    </nav>
    
    <div class="sidebar-footer">
      <button class="auto-run-toggle" id="autoRunToggle" onclick="toggleAutoRun()">
        <span>⚡ تشغيل تلقائي</span>
        <div class="switch"></div>
      </button>
      <button class="theme-toggle" onclick="toggleTheme()">
        <span id="themeIcon">🌙</span>
        <span id="themeText">الوضع الليلي</span>
      </button>
    </div>
  </aside>

  <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

  <!-- المحتوى الرئيسي -->
  <main class="content">
    <div class="topbar">

/* ============================================================
   الحالة العامة
   ============================================================ */
const codeEditor = document.getElementById('codeEditor');
const lineNumbers = document.getElementById('lineNumbers');
let currentLang = "html";
let isDark = true;
let errorLines = [];
let warningLines = [];
let autoRun = true;
let autoRunTimer = null;
let pyodideReady = false;
let pyodide = null;
let sqlReady = false;
let SQL = null;
let lastRunTime = 0;

/* ============================================================
   أدوات
   ============================================================ */
function setStatus(text, busy, error) {
  document.getElementById('statusText').textContent = text;
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (busy ? ' busy' : '') + (error ? ' error' : '');
}

function setEngine(text) {
  document.getElementById('engineInfo').textContent = text;
}

function updateCursorInfo() {
  const pos = codeEditor.selectionStart;
  const text = codeEditor.value.substring(0, pos);
  const line = text.split('\n').length;
  const col = pos - text.lastIndexOf('\n');
  document.getElementById('cursorInfo').textContent = `السطر ${line}:${col}`;
}

function updateLastRun() {
  const now = Date.now();
  lastRunTime = now;
  const t = new Date(now);
  document.getElementById('lastRunInfo').textContent = 'آخر تشغيل: ' + 
    t.getHours().toString().padStart(2,'0') + ':' +
    t.getMinutes().toString().padStart(2,'0') + ':' +
    t.getSeconds().toString().padStart(2,'0');
}

/* ============================================================
   أرقام الأسطر
   ============================================================ */
function updateLineNumbers() {
  const lines = codeEditor.value.split('\n');
  let html = '';
  for (let i = 1; i <= lines.length; i++) {
    const isErr = errorLines.includes(i);
    const isWarn = warningLines.includes(i);
    let cls = '';
    if (isErr) cls = 'err-num';
    else if (isWarn) cls = 'warn-num';
    html += `<div class="${cls}">${i}</div>`;
  }
  lineNumbers.innerHTML = html;
  lineNumbers.scrollTop = codeEditor.scrollTop;
  updateCursorInfo();
}

codeEditor.addEventListener('scroll', () => {
  lineNumbers.scrollTop = codeEditor.scrollTop;
});

codeEditor.addEventListener('input', () => {
  updateLineNumbers();
  scheduleAutoRun();
});

codeEditor.addEventListener('click', updateCursorInfo);
codeEditor.addEventListener('keyup', updateCursorInfo);

codeEditor.addEventListener('keydown', (e) => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const s = codeEditor.selectionStart;
    codeEditor.value = codeEditor.value.substring(0, s) + '    ' + codeEditor.value.substring(codeEditor.selectionEnd);
    codeEditor.selectionStart = codeEditor.selectionEnd = s + 4;
    updateLineNumbers();
  }
});

/* ============================================================
   التشغيل التلقائي
   ============================================================ */
function toggleAutoRun() {
  autoRun = !autoRun;
  const toggle = document.getElementById('autoRunToggle');
  const indicator = document.getElementById('autoIndicator');
  const autoText = document.getElementById('autoText');
  
  if (autoRun) {
    toggle.classList.add('on');
    indicator.classList.add('active');
    autoText.textContent = 'تلقائي';
    showToast('⚡ التشغيل التلقائي مُفعّل');
    scheduleAutoRun();
  } else {
    toggle.classList.remove('on');
    indicator.classList.remove('active');
    autoText.textContent = 'يدوي';
    showToast('⏸ التشغيل التلقائي متوقف', 'info');
  }
}

function scheduleAutoRun() {
  if (!autoRun) return;
  clearTimeout(autoRunTimer);
  document.getElementById('autoText').textContent = 'ينتظر...';
  autoRunTimer = setTimeout(() => {
    runCode(false);
  }, 1200);
}

   قوائم اللغات
   ============================================================ */
function populateLangLists() {
  const langSelect = document.getElementById('langSelect');
  const tipsLangSelect = document.getElementById('tipsLangSelect');
  
  Object.keys(LANGUAGES).forEach(key => {
    const lang = LANGUAGES[key];

    o1.value = key;
    o1.textContent = lang.icon + ' ' + lang.name;
    langSelect.appendChild(o1);

    o2.value = key;
    o2.textContent = lang.icon + ' ' + lang.name;
    tipsLangSelect.appendChild(o2);

function changeLang() {
  currentLang = document.getElementById('langSelect').value;
  codeEditor.value = STARTER_CODE[currentLang] || '';
  updateLineNumbers();
  clearErrorLines();
  setEngine(LANGUAGES[currentLang].name + ' محلي');
  const icon = LANGUAGES[currentLang].icon || '';
  showToast(`${icon} ${LANGUAGES[currentLang].name}`, 'info');

}

/* ============================================================
   التنقل
   ============================================================ */
function initNavigation() {
  document.querySelectorAll('.nav-item').forEach(item => {
    item.addEventListener('click', () => {
      const page = item.dataset.page;
      document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + page).classList.add('active');
      if (page === 'projects') loadProjects();
      if (page === 'tips') loadTips();
      closeSidebar();
    });
  });
  
  document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
      const target = tab.dataset.tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
      tab.classList.add('active');
      document.getElementById('tab-' + target).classList.remove('hidden');
    });
  });
}

function switchTab(name) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
  const target = document.getElementById('tab-' + name);
  if (target) target.classList.remove('hidden');
}

    isDark = false;

}

/* ============================================================
   التشغيل الرئيسي
   ============================================================ */
async function runCode(manual = false) {
  const lang = LANGUAGES[currentLang];
  if (!lang) return;
  
  const code = codeEditor.value;
  const runBtn = document.getElementById('runBtn');
  
  if (!code.trim()) {
    showOutput('⚠️ لا يوجد كود');
    return;
  }
  
  if (manual) {
    runBtn.disabled = true;
    runBtn.innerHTML = '<span class="loading"></span>';
  }
  
  document.getElementById('autoText').textContent = 'ينفذ...';
  
  try {
    if (lang.engine === 'web') runWeb(code, currentLang);
    else if (lang.engine === 'pyodide') await runPython(code);
    else if (lang.engine === 'sqlite') await runSQL(code);
    else if (lang.engine === 'markdown') runMarkdown(code);
    else if (lang.engine === 'json') runJSON(code);
    else if (lang.engine === 'yaml') runYAML(code);
    else if (lang.engine === 'xml') runXML(code);
    
    updateLastRun();
    if (autoRun) document.getElementById('autoText').textContent = 'تلقائي';
  } catch (err) {
    showOutput('❌ خطأ:\n' + err.message);
    setStatus('خطأ', false, true);
    if (autoRun) document.getElementById('autoText').textContent = 'خطأ';
  } finally {
    if (manual) {
      runBtn.disabled = false;
      runBtn.innerHTML = '▶ تشغيل';
    }
  }
}

/* ============================================================
   محرك الويب (HTML/CSS/JS)
   ============================================================ */
let consoleMessages = [];

function runWeb(code, langKey) {
  consoleMessages = [];
  
  let previewFrame = document.getElementById('previewFrame');
  if (!previewFrame) {
    const output = document.getElementById('tab-output');
    output.innerHTML = '';
    previewFrame = document.createElement('iframe');
    previewFrame.id = 'previewFrame';
    previewFrame.sandbox = 'allow-scripts allow-modals allow-forms allow-popups';
    output.appendChild(previewFrame);
  }
  
  let html = code;
  
  if (langKey === 'css' && !code.toLowerCase().includes('<html')) {
    html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${code}</style></head>
<body><h1>تجربة CSS</h1><p>هذا نص تجريبي</p>
<div class="card box">صندوق</div><button>زر</button></body></html>`;
  }
  
  // التقاط console
  const consoleScript = `<script>
    (function(){
      const send = (type, args) => {
        try {
          window.parent.postMessage({
            type: 'console', 
            level: type,
            args: Array.from(args).map(a => {
              if (typeof a === 'object') { try { return JSON.stringify(a); } catch(e) { return String(a); } }
              return String(a);
            }).join(' ')
          }, '*');
        } catch(e){}
      };
      const _log = console.log;
      const _err = console.error;
      const _warn = console.warn;
      console.log = function(){ send('log', arguments); _log.apply(console, arguments); };
      console.error = function(){ send('error', arguments); _err.apply(console, arguments); };
      console.warn = function(){ send('warn', arguments); _warn.apply(console, arguments); };
      
      window.addEventListener('error', function(e) {
        send('error', ['❌ ' + e.message + ' (سطر ' + e.lineno + ')']);
      });
    })();
  <\/script>`;
  
  if (html.includes('</head>')) {
    html = html.replace('</head>', consoleScript + '</head>');
  } else if (html.includes('<body')) {
    html = html.replace('<body', consoleScript + '<body');
  } else {
    html = consoleScript + html;
  }
  
  // إزالة listener قديم
  window.onmessage = (e) => {
    if (e.data && e.data.type === 'console') {
      consoleMessages.push({
        level: e.data.level,
        text: e.data.args
      });
      updateConsoleErrors();
    }
  };
  
  previewFrame.srcdoc = html;
  switchTab('output');
  setStatus('تم التشغيل', false);
  setEngine(LANGUAGES[langKey].name + ' محلي');
  
  setTimeout(() => {
    if (consoleMessages.length === 0) {
      clearErrorLines();
      document.getElementById('errorBadge').classList.add('hidden');
      document.getElementById('tab-errors').innerHTML = 
        '<div class="empty-state success"><span class="big-icon">✅</span>لا توجد أخطاء في الكونسول</div>';
    }
  }, 300);
}

function updateConsoleErrors() {
  const errors = consoleMessages.filter(m => m.level === 'error');
  const warns = consoleMessages.filter(m => m.level === 'warn');
  
  const badge = document.getElementById('errorBadge');
  if (errors.length > 0) {
    badge.textContent = errors.length;
    badge.className = 'tab-badge';
    badge.classList.remove('hidden');
  } else if (warns.length > 0) {
    badge.textContent = warns.length;
    badge.className = 'tab-badge warning';
    badge.classList.remove('hidden');
  } else {
    badge.classList.add('hidden');
  }
  
  if (errors.length === 0 && warns.length === 0 && consoleMessages.length === 0) return;
  
  const div = document.getElementById('tab-errors');
  let html = '';
  
  if (errors.length === 0 && warns.length === 0) {
    html = '<div class="empty-state success"><span class="big-icon">✅</span>لا توجد أخطاء</div>';
  } else {
    errors.forEach(err => {
      html += `
        <div class="error-item">
          <div class="header">
            <span class="icon">❌</span>
            <span class="line">خطأ JavaScript</span>

            <span class="line">تحذير</span>

    });

  div.innerHTML = html;
}

async function loadPyodide() {

  return new Promise((resolve, reject) => {

      window.loadPyodide({
        indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
      }).then(py => {
        pyodide = py;
        pyodideReady = true;
        resolve(py);
      }).catch(reject);
      return;
    }
    
    const script = document.createElement('script');
    script.src = 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/pyodide.js';
    script.onload = async () => {
      try {
        pyodide = await window.loadPyodide({
          indexURL: 'https://cdn.jsdelivr.net/pyodide/v0.24.1/full/'
        });
        pyodideReady = true;
        resolve(pyodide);
      } catch (e) { reject(e); }
    };
    script.onerror = () => reject(new Error('فشل تحميل Pyodide'));
    document.head.appendChild(script);
  });
}

async function runPython(code) {
  try {
    const py = await loadPyodide();
    
    py.runPython(`
import sys
import io
_buf = io.StringIO()
sys.stdout = _buf
sys.stderr = _buf
`);
    
    let output = '';
    let errorText = '';
    
    try {
      py.runPython(code);
      output = py.runPython('_buf.getvalue()');
    } catch (e) {
      errorText = e.message || String(e);
      try { output = py.runPython('_buf.getvalue()'); } catch(_){}
    } finally {
      py.runPython(`
sys.stdout = sys.__stdout__
sys.stderr = sys.__stderr__
`);
    }
    
    if (errorText) {
      // عرض المخرجات قبل الخطأ
      if (output) {
        const outDiv = document.getElementById('tab-output');
        outDiv.innerHTML = '';
        const pre = document.createElement('pre');
        pre.style.cssText = 'color:var(--text); margin:0; white-space:pre-wrap;';
        pre.textContent = output;
        outDiv.appendChild(pre);
      } else {
        showOutput('');
      }
      
      // عرض الخطأ
      const errDiv = document.getElementById('tab-errors');
      const lineMatch = errorText.match(/line (\d+)/);
      const lineNum = lineMatch ? lineMatch[1] : null;
      
      let html = `
        <div class="error-item">
          <div class="header">
            <span class="icon">🐛</span>
            ${lineNum ? `<span class="line">السطر ${lineNum}</span>` : '<span class="line">خطأ Python</span>'}
          </div>
          <div class="message">${escapeHtml(errorText)}</div>
          ${generatePythonSuggestion(errorText) ? 
            `<div class="suggestion">${escapeHtml(generatePythonSuggestion(errorText))}</div>` : ''}
        </div>`;
      errDiv.innerHTML = html;
      
      if (lineNum) {
        errorLines = [parseInt(lineNum)];
        updateLineNumbers();
      }
      
      const badge = document.getElementById('errorBadge');
      badge.textContent = '1';
      badge.className = 'tab-badge';
      badge.classList.remove('hidden');
      
      setStatus('خطأ', false, true);
    } else {
      showOutput(output || '✅ تم التنفيذ بدون مخرجات');
      clearErrorLines();
      document.getElementById('errorBadge').classList.add('hidden');
      document.getElementById('tab-errors').innerHTML = 
        '<div class="empty-state success"><span class="big-icon">✅</span>لا توجد أخطاء</div>';
      setStatus('تم بنجاح ✅', false);
    }
    
    setEngine('Python (Pyodide)');
    
  } catch (err) {
    showOutput('❌ فشل تحميل Python:\n' + err.message);
    setStatus('فشل', false, true);
  }
}

function generatePythonSuggestion(errorText) {
  const msg = errorText.toLowerCase();
  if (msg.includes('indentationerror')) return 'تحقق من المسافات البادئة (4 مسافات ثابتة)';
  if (msg.includes('syntaxerror')) return 'خطأ في الصياغة — تحقق من الأقواس والنقطتين ":"';
  if (msg.includes('nameerror')) {
    const m = errorText.match(/name '(\w+)'/);
    return m ? `"${m[1]}" غير معرّف. تأكد من كتابته بشكل صحيح.` : 'اسم غير معرّف';
  }
  if (msg.includes('typeerror')) return 'خطأ في نوع البيانات — تحقق من العمليات';
  if (msg.includes('zerodivision')) return 'لا يمكن القسمة على صفر';
  if (msg.includes('indexerror')) return 'الفهرس خارج نطاق القائمة';
  if (msg.includes('keyerror')) return 'المفتاح غير موجود في القاموس';
  if (msg.includes('attributeerror')) return 'الخاصية غير موجودة في هذا الكائن';
  if (msg.includes('valueerror')) return 'القيمة غير صحيحة';
  if (msg.includes('importerror') || msg.includes('modulenotfounderror')) return 'المكتبة غير مثبتة في Pyodide';
  return null;
}

/* ============================================================
   محرك SQL (sql.js)
   ============================================================ */
async function loadSQL() {
  if (sqlReady) return SQL;
  
  showOutput('⏳ تحميل محرك SQLite...');
  setStatus('تحميل SQL...', true);
  
  return new Promise((resolve, reject) => {
    if (window.initSqlJs) {
      window.initSqlJs({
        locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`
      }).then(SQLModule => {
        SQL = SQLModule;
        sqlReady = true;
        resolve(SQLModule);
      }).catch(reject);
      return;
    }
    
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js';
    script.onload = async () => {
      try {
        SQL = await window.initSqlJs({
          locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/${f}`
        });
        sqlReady = true;
        resolve(SQL);
      } catch (e) { reject(e); }
    };
    script.onerror = () => reject(new Error('فشل تحميل SQLite'));
    document.head.appendChild(script);
  });
}

async function runSQL(code) {
  try {
    const SQLModule = await loadSQL();
    const db = new SQLModule.Database();
    
    const statements = code.split(';').map(s => s.trim()).filter(s => s);
    let output = '';
    let errors = [];
    
    for (const stmt of statements) {
      try {
        const result = db.exec(stmt);
        if (result.length > 0) {
          for (const r of result) {
            output += '📋 النتيجة:\n';
            output += '┌' + '─'.repeat(40) + '\n';
            output += '│ ' + r.columns.join('  │  ') + '\n';
            output += '├' + '─'.repeat(40) + '\n';
            for (const row of r.values) {
              output += '│ ' + row.map(v => String(v ?? 'NULL')).join('  │  ') + '\n';
            }
            output += '└' + '─'.repeat(40) + '\n';
            output += `📊 عدد الصفوف: ${r.values.length}\n\n`;
          }
        } else {
          output += '✅ تم: ' + stmt.substring(0, 60).replace(/\s+/g, ' ') + '\n\n';
        }
      } catch (e) {
        errors.push({ stmt: stmt.substring(0, 40), msg: e.message });
        output += '❌ خطأ: ' + e.message + '\n\n';
      }
    }
    
    showOutput(output || '✅ تم التنفيذ');
    
    if (errors.length > 0) {
      const errDiv = document.getElementById('tab-errors');
      errDiv.innerHTML = errors.map(err => `
        <div class="error-item">
          <div class="header">
            <span class="icon">❌</span>
            <span class="line">خطأ SQL</span>
          </div>
          <div class="message">${escapeHtml(err.msg)}</div>
        </div>
      `).join('');
      const badge = document.getElementById('errorBadge');
      badge.textContent = errors.length;
      badge.className = 'tab-badge';
      badge.classList.remove('hidden');
      setStatus('خطأ', false, true);
    } else {
      document.getElementById('tab-errors').innerHTML = 
        '<div class="empty-state success"><span class="big-icon">✅</span>لا توجد أخطاء</div>';
      document.getElementById('errorBadge').classList.add('hidden');
      setStatus('تم بنجاح ✅', false);
    }
    
    setEngine('SQLite (محلي)');
  } catch (err) {
    showOutput('❌ فشل SQL: ' + err.message);
    setStatus('فشل', false, true);
  }
}

/* ============================================================
   Markdown
   ============================================================ */
function runMarkdown(code) {
  let html = code
    .replace(/^### (.*)$/gm, '<h3>$1</h3>')
    .replace(/^## (.*)$/gm, '<h2>$1</h2>')
    .replace(/^# (.*)$/gm, '<h1>$1</h1>')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/~~(.+?)~~/g, '<del>$1</del>')
    .replace(/`([^`]+)`/g, '<code style="background:#1c2330;color:#f85149;padding:2px 6px;border-radius:4px;font-family:monospace">$1</code>')
    .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre style="background:#1c2330;color:#7ee787;padding:12px;border-radius:8px;overflow-x:auto"><code>$2</code></pre>')
    .replace(/\[(.+?)\]\((.+?)\)/g, '<a href="$2" target="_blank" style="color:#58a6ff">$1</a>')
    .replace(/^- \[x\] (.+)$/gm, '<li style="list-style:none">✅ $1</li>')
    .replace(/^- \[ \] (.+)$/gm, '<li style="list-style:none">⬜ $1</li>')
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/^(\d+)\. (.+)$/gm, '<li>$2</li>')
    .replace(/^> (.+)$/gm, '<blockquote style="border-right:4px solid #58a6ff;padding:8px 16px;margin:8px 0;background:rgba(88,166,255,0.1)">$1</blockquote>')
    .replace(/^---$/gm, '<hr style="border:none;border-top:1px solid #30363d;margin:20px 0">')
    .replace(/\n/g, '<br>');
  
  html = html.replace(/(<li>.*<\/li>)/s, '<ul style="padding-right:20px">$1</ul>');
  
  const full = `<!DOCTYPE html><html><head><meta charset="UTF-8">
<style>
body{font-family:Arial,sans-serif;padding:24px;line-height:1.7;background:white;color:#222;max-width:800px;margin:0 auto}
h1{color:#0969da;border-bottom:2px solid #0969da;padding-bottom:8px}
h2{color:#8250df;margin-top:24px}
h3{color:#bf3989}
a{color:#0969da}
table{border-collapse:collapse;width:100%;margin:16px 0}
th,td{border:1px solid #ddd;padding:8px;text-align:right}
th{background:#f6f8fa}
</style>
</head><body>${html}</body></html>`;
  
  let previewFrame = document.getElementById('previewFrame');
  if (!previewFrame) {
    const output = document.getElementById('tab-output');
    output.innerHTML = '';
    previewFrame = document.createElement('iframe');
    previewFrame.id = 'previewFrame';
    output.appendChild(previewFrame);
  }
  previewFrame.srcdoc = full;
  switchTab('output');
  setEngine('Markdown محلي');
  setStatus('تم ✅', false);
  document.getElementById('tab-errors').innerHTML = 
    '<div class="empty-state success"><span class="big-icon">✅</span>Markdown لا يحتوي أخطاء</div>';
  document.getElementById('errorBadge').classList.add('hidden');
}

function runJSON(code) {
  try {

    let stats = '✅ JSON صالح!\n\n';
    stats += '📊 إحصائيات:\n';
    stats += '• الأحرف: ' + code.length + '\n';
    stats += '• الأسطر: ' + code.split('\n').length + '\n';
    stats += '• الحجم: ' + (new Blob([code]).size) + ' bytes\n';
    
    if (Array.isArray(obj)) {
      stats += '• النوع: مصفوفة\n';
      stats += '• عدد العناصر: ' + obj.length + '\n';
    } else if (typeof obj === 'object' && obj !== null) {
      stats += '• النوع: كائن\n';
      stats += '• عدد الخصائص: ' + Object.keys(obj).length + '\n';
      stats += '\n📋 الخصائص:\n';
      Object.keys(obj).forEach(k => {
        const v = obj[k];
        const type = Array.isArray(v) ? 'array[' + v.length + ']' : typeof v;
        stats += '  • ' + k + ': ' + type + '\n';
      });
    }
    
    stats += '\n📄 النسخة المنسّقة:\n' + JSON.stringify(obj, null, 2);
    
    showOutput(stats);
    setEngine('JSON محلي');
    setStatus('JSON صالح ✅', false);
    document.getElementById('tab-errors').innerHTML = 
      '<div class="empty-state success"><span class="big-icon">✅</span>JSON صالح</div>';
    document.getElementById('errorBadge').classList.add('hidden');
    clearErrorLines();
  } catch (e) {
    showOutput('❌ JSON غير صالح:\n\n' + e.message);
    
    const lineMatch = e.message.match(/position (\d+)/);
    let errLine = null;
    if (lineMatch) {
      const pos = parseInt(lineMatch[1]);

    errDiv.innerHTML = `
      <div class="error-item">

    badge.textContent = '1';

    badge.classList.remove('hidden');

/* ============================================================
   YAML
   ============================================================ */
function runYAML(code) {
  const lines = code.split('\n');
  const errors = [];
  
  lines.forEach((line, idx) => {
    if (line.trim().startsWith('#') || !line.trim()) return;
    // فحص أساسي
    if (!line.startsWith(' ') && !line.startsWith('-') && !line.includes(':') && line.match(/[a-zA-Z\u0600-\u06FF]/)) {
      errors.push({ line: idx + 1, msg: 'يفتقد ":" بعد المفتاح' });
    }
  });
  
  let output = '📄 YAML\n\n';
  output += '📊 الأسطر: ' + lines.length + '\n';
  output += '📊 الأحرف: ' + code.length + '\n\n';
  
  if (errors.length > 0) {
    output += '⚠️ تحذيرات:\n';
    errors.forEach(e => output += `  • السطر ${e.line}: ${e.msg}\n`);
  } else {
    output += '✅ البنية تبدو سليمة\n';
  }
  
  output += '\n📋 المحتوى:\n' + code;
  
  showOutput(output);
  setEngine('YAML محلي');
  setStatus(errors.length > 0 ? 'تحذيرات' : '✅ صالح', false);
  
  if (errors.length > 0) {
    warningLines = errors.map(e => e.line);
    updateLineNumbers();
  }
}

  let html = `<h2>${icon} نصائح ${langName} <span style="font-size:14px;color:var(--text-dim);font-weight:normal">(${totalFuncs} دالة/ميزة)</span></h2>`;

    html += `<div class="tips-section">
      <h3>${section.title}</h3>`;

      const sid = `snip_${langKey}_${idx}`;
      window[sid] = fn.example;
      html += `
        <div class="func-item">
          <span class="fname">${escapeHtml(fn.name)}</span>
          <div class="fdesc">${escapeHtml(fn.desc)}</div>

        </div>`;
    });
    
    html += `</div>`;
  });
  
  container.innerHTML = html;
}

function insertSnippetById(id) {
  const code = window[id];
  if (!code) return;
  
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector('[data-page="editor"]').classList.add('active');
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-editor').classList.add('active');
  
  codeEditor.value = codeEditor.value + '\n' + code + '\n';
  updateLineNumbers();
  showToast('✅ تم الإدراج في المحرر');
  closeSidebar();
  scheduleAutoRun();
}

function saveProject() {
  const name = document.getElementById('projectName').value.trim() || 'مشروع';
  const code = codeEditor.value;
  if (!code.trim()) { showToast('⚠️ لا يوجد كود', 'error'); return; }
  
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  const idx = projects.findIndex(p => p.name === name);
  const project = {
    name, code, lang: currentLang,
    date: new Date().toISOString(),
    id: idx >= 0 ? projects[idx].id : Date.now()
  };
  
  if (idx >= 0) { projects[idx] = project; showToast('💾 تم التحديث'); }
  else { projects.push(project); showToast('💾 تم الحفظ'); }
  
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
}

function loadProjects() {
  const grid = document.getElementById('projectsGrid');
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  
  if (projects.length === 0) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><span class="big-icon">📭</span>لا توجد مشاريع محفوظة</div>';
    return;
  }
  
  grid.innerHTML = '';
  projects.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(p => {
    const card = document.createElement('div');
    card.className = 'project-card';
    const lang = LANGUAGES[p.lang];
    card.innerHTML = `
      <span class="lang-badge">${lang?.icon || ''} ${lang?.name || p.lang}</span>
      <h3>${escapeHtml(p.name)}</h3>
      <div class="meta">📅 ${new Date(p.date).toLocaleString('ar-EG')}</div>
      <div class="actions">
        <button onclick="openProject(${p.id})" style="background:var(--primary-2);color:white;border:none;">📂 فتح</button>
        <button class="danger" onclick="deleteProject(${p.id})">🗑 حذف</button>
      </div>
    `;
    grid.appendChild(card);
  });
}

function openProject(id) {
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  const p = projects.find(x => x.id === id);
  if (!p) return;
  currentLang = p.lang;
  document.getElementById('langSelect').value = p.lang;
  document.getElementById('projectName').value = p.name;
  codeEditor.value = p.code;
  updateLineNumbers();
  clearErrorLines();
  document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
  document.querySelector('[data-page="editor"]').classList.add('active');
  document.querySelectorAll('.page').forEach(pg => pg.classList.remove('active'));
  document.getElementById('page-editor').classList.add('active');
  showToast('📂 تم الفتح');
  scheduleAutoRun();
}

function deleteProject(id) {
  if (!confirm('حذف المشروع؟')) return;
  let projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  projects = projects.filter(p => p.id !== id);
  localStorage.setItem('iqcode-projects', JSON.stringify(projects));
  loadProjects();
  showToast('🗑 تم الحذف');
}

function clearAllProjects() {
  if (!confirm('حذف جميع المشاريع؟')) return;
  localStorage.removeItem('iqcode-projects');
  loadProjects();
  showToast('🗑 تم المسح');
}

function exportProjects() {
  const projects = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
  if (projects.length === 0) { showToast('⚠️ لا توجد مشاريع', 'error'); return; }
  const blob = new Blob([JSON.stringify({
    app: 'İQCODE', version: '7.0',
    exportedAt: new Date().toISOString(),
    projects
  }, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `iqcode_backup_${new Date().toISOString().slice(0,10)}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`📤 تم تصدير ${projects.length} مشروع`);
}

function importProjects(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      let imported = Array.isArray(data) ? data : (data.projects || []);
      const existing = JSON.parse(localStorage.getItem('iqcode-projects') || '[]');
      let added = 0, updated = 0;
      imported.forEach(p => {
        if (!p.name || !p.code || !p.lang) return;
        const idx = existing.findIndex(x => x.name === p.name);
        const project = {
          name: p.name, code: p.code, lang: p.lang,
          date: p.date || new Date().toISOString(),
          id: idx >= 0 ? existing[idx].id : Date.now() + Math.random()
        };
        if (idx >= 0) { existing[idx] = project; updated++; }
        else { existing.push(project); added++; }
      });
      localStorage.setItem('iqcode-projects', JSON.stringify(existing));
      loadProjects();
      showToast(`📥 ${added} جديد، ${updated} محدّث`);
    } catch (err) {
      showToast('❌ ملف غير صالح', 'error');
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

/* ============================================================
   التنزيل
   ============================================================ */
function downloadCode() {
  const lang = LANGUAGES[currentLang];
  if (!lang) return;
  const code = codeEditor.value;
  const name = (document.getElementById('projectName').value.trim() || 'project')
    .replace(/[^a-zA-Z0-9_\u0600-\u06FF-]/g, '_');
  const filename = `${name}.${lang.fileExt}`;
  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast(`⬇ تم تنزيل ${filename}`);
}

/* ============================================================
   الإشعارات
   ============================================================ */
function showToast(msg, type = 'success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type === 'error' ? ' error' : type === 'info' ? ' info' : '');
  clearTimeout(t._timeout);
  t._timeout = setTimeout(() => t.className = 'toast', 2600);
}

/* ============================================================
   القائمة الجانبية
   ============================================================ */
function openSidebar() {
  document.getElementById('sidebar').classList.add('open');
  document.getElementById('overlay').classList.add('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}

/* ============================================================
   شريط التقسيم
   ============================================================ */
function initDivider() {
  const divider = document.getElementById('divider');
  const outputSection = document.getElementById('outputSection');
  let isDragging = false;
  function start(e) { isDragging = true; e.preventDefault(); }
  function end() { isDragging = false; }
  function move(y) {
    if (!isDragging) return;
    const wrapper = document.querySelector('.editor-wrapper');
    const rect = wrapper.getBoundingClientRect();
    const newHeight = rect.bottom - y - 25;
    if (newHeight > 100 && newHeight < rect.height - 100) {
      outputSection.style.height = newHeight + 'px';
    }
  }
  divider.addEventListener('mousedown', start);
  document.addEventListener('mouseup', end);
  document.addEventListener('mousemove', e => move(e.clientY));
  divider.addEventListener('touchstart', start, { passive: false });
  document.addEventListener('touchend', end);
  document.addEventListener('touchmove', e => move(e.touches[0].clientY), { passive: true });
}

/* ============================================================
   اختصارات
   ============================================================ */
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault();
    runCode(true);
  }
  if ((e.ctrlKey || e.metaKey) && e.key === 's') {
    e.preventDefault();
    saveProject();
  }
});

/* ============================================================
   البدء
   ============================================================ */
(function init() {
  console.log('İQCODE v7.0 starting...');
  try {
    restoreTheme();
    populateLangLists();
    initNavigation();
    initDivider();
    
    // تحميل HTML افتراضياً
    currentLang = 'html';
    codeEditor.value = STARTER_CODE.html;
    updateLineNumbers();
    loadTips();
    
    setStatus('جاهز', false);
    setEngine('HTML محلي');
    
    // تفعيل التشغيل التلقائي
    document.getElementById('autoRunToggle').classList.add('on');
    document.getElementById('autoIndicator').classList.add('active');
    document.getElementById('autoText').textContent = 'تلقائي';
    
    // تشغيل أولي
    setTimeout(() => runCode(false), 500);
    
    console.log('İQCODE ready ✅');
  } catch (e) {
    console.error('Init error:', e);
  }
})();
</script>
